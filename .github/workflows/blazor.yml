name: Gardenerim.Blazor 1.0

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: blazor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GARDENER_REQUIRE_FIREFOX: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/blazor/package-lock.json
      - run: npm ci
        working-directory: packages/blazor
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/blazor
      - run: npm run release:verify
        working-directory: packages/blazor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gardener-blazor-2.1.0
          path: |
            packages/blazor/artifacts/Gardenerim.Blazor.2.1.0.nupkg
            packages/blazor/artifacts/Gardenerim.Blazor.2.1.0.snupkg
            packages/blazor/artifacts/gardener-blazor.performance.json

  net11-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: dotnet pack src/Gardenerim.Blazor/Gardenerim.Blazor.csproj -c Release -o artifacts
        working-directory: packages/blazor
      - run: npm run test:net11
        working-directory: packages/blazor
