name: Gardenerim.Blazor 1.0

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: blazor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GARDENER_REQUIRE_FIREFOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/blazor/package-lock.json
      - run: npm ci
        working-directory: packages/blazor
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/blazor
      - run: npm run release:verify
        working-directory: packages/blazor
      - uses: actions/upload-artifact@v4
        with:
          name: gardener-blazor-2.0.0
          path: |
            packages/blazor/artifacts/Gardenerim.Blazor.2.0.0.nupkg
            packages/blazor/artifacts/Gardenerim.Blazor.2.0.0.snupkg
            packages/blazor/artifacts/gardener-blazor.performance.json

  net11-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: dotnet pack src/Gardenerim.Blazor/Gardenerim.Blazor.csproj -c Release -o artifacts
        working-directory: packages/blazor
      - run: npm run test:net11
        working-directory: packages/blazor
