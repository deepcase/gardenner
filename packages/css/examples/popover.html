<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPopover</title><link rel="stylesheet" href="../dist/gardener.css"><style>main{max-width:800px;margin:auto;padding:24px}fieldset{display:flex;flex-wrap:wrap;gap:12px;margin-block:16px;border:1px solid var(--g-color-border);padding:16px}#stage{padding:60px 24px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;border:1px solid var(--g-color-border)}label{display:flex;align-items:center;gap:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}input,select{font:inherit}</style></head><body><main><h1>GPopover</h1><p>十二方向、组合触发、受控开关与内容插槽。</p><fieldset><legend>参数</legend><label>位置<select id="position"></select></label><label>触发<select id="trigger"><option>click</option><option>hover focus</option><option>focus</option><option>contextMenu</option><option>manual</option></select></label><label><input id="arrow" type="checkbox" checked>箭头</label><label><input id="controlled" type="checkbox">受控</label><label><input id="disabled" type="checkbox">禁用</label></fieldset><div id="stage"><div id="popover" data-g-popover><button class="g-btn" type="button" data-g-popover-trigger>项目详情</button><div data-g-popover-content hidden><h2 class="g-popover-title">项目设置</h2><div class="g-popover-content"><p>切换位置保留输入内容。</p><label>备注<input id="note" value="设计评审"></label></div><div class="g-popover-footer"><button type="button" class="g-btn" data-g-close>保存备注</button></div></div></div><button class="g-btn" type="button" id="manual">手动打开</button></div><output id="result" aria-live="polite">已关闭</output><pre id="code"></pre></main><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';const root=document.getElementById('popover'),$=id=>document.getElementById(id);for(const p of ['top','tl','tr','bottom','bl','br','left','lt','lb','right','rt','rb'])$('position').add(new Option(p,p));let visible=false;function update(){const o={position:$('position').value,trigger:$('trigger').value,showArrow:$('arrow').checked,disabled:$('disabled').checked,width:300};if($('controlled').checked)o.popupVisible=visible;root.setAttribute('data-g-overlay-options',JSON.stringify(o));$('code').textContent=JSON.stringify(o,null,2);}update();init(root);for(const id of ['position','trigger','arrow','controlled','disabled'])$(id).addEventListener('change',update);root.addEventListener('gardener:change',e=>{if(e.target!==root)return;visible=Boolean(e.detail.value);$('result').textContent=visible?'已打开':'已关闭';if($('controlled').checked)update();});$('manual').onclick=()=>getInstance(root,'popover').open();</script></body></html>
