<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTimeline 参数演示</title><link rel="stylesheet" href="../dist/gardener.css"></head><body><main style="max-width:760px;padding:24px;font:14px/1.6 var(--g-font-sans)"><h1>GTimeline</h1><label>方向 <select id="direction"><option>vertical</option><option>horizontal</option></select></label><label><input id="reverse" type="checkbox">倒序</label><button type="button" id="add">添加事件</button><div style="padding:24px"><div id="timeline" class="g-timeline" data-g-data-display></div></div><output aria-live="polite">尚未操作</output></main><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';const el=document.getElementById('timeline'),items=[{key:'one',content:'创建项目',label:'09:00',actions:[{key:'open',label:'查看详情'}]},{key:'two',content:'发布版本',label:'12:00'}];el.dataset.gDataOptions=JSON.stringify({items,pending:'处理中…',responsive:true});init(el);const api=getInstance(el,'data-display');document.getElementById('direction').onchange=e=>api.setOptions({direction:e.target.value});document.getElementById('reverse').onchange=e=>api.setOptions({reverse:e.target.checked});document.getElementById('add').onclick=()=>{items.push({key:String(items.length+1),content:'新增事件',label:'刚刚'});api.setOptions({items})};el.addEventListener('gardener:action',e=>document.querySelector('output').textContent='事件 '+e.detail.key);</script></body></html>
