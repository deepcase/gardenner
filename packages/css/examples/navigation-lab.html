<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航 · 参数实验室</title><link rel="stylesheet" href="../dist/gardener.min.css"><style>body{margin:0;padding:24px;font:14px/1.6 var(--g-font-sans);color:var(--g-color-text);background:var(--g-color-surface)}main{max-width:1120px;margin:auto}h1{font-size:26px}#settings{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}label{display:inline-flex;gap:6px;align-items:center}select,input[type=number]{max-width:210px;padding:5px;border:1px solid var(--g-color-border);border-radius:4px;background:var(--g-color-surface);color:inherit}input[type=number]{width:86px}#parameters{display:flex;flex-wrap:wrap;gap:12px;padding:16px 0}#specimen{padding:16px;border:1px solid var(--g-color-border);border-radius:4px;margin-top:16px;min-height:100px}output{display:block;margin:16px 0;overflow-wrap:anywhere}#navigation-scroll-area{height:220px;overflow:auto;border:1px solid var(--g-color-border);margin:16px 0}article{min-height:280px;padding:24px}pre{max-height:300px;overflow:auto;white-space:pre-wrap}</style></head><body><main><h1>导航 · 参数实验室</h1><p>41 个组件，123 个业务场景；可组合尺寸、外观、显示规则与交互策略。</p><div id="settings"><label>组件<select id="component" aria-label="组件"></select></label><label>场景<select id="scenario" aria-label="场景"></select></label><label>变体<select id="variant" aria-label="变体"></select></label><label>尺寸<select id="size" aria-label="尺寸"><option value="medium">中</option><option value="small">小</option><option value="large">大</option></select></label><label>外观<select id="appearance" aria-label="外观"><option>default</option><option>line</option><option>pill</option><option>card</option><option>contained</option></select></label><label><input id="disabled" type="checkbox">禁用</label><label><input id="loading" type="checkbox">加载</label><label><input id="empty" type="checkbox">空数据</label><label><input id="rtl" type="checkbox">RTL</label></div><details><summary>显示、布局与关闭策略</summary><div id="parameters"></div><p>长度为像素，超时为毫秒；0 表示不限制。</p></details><div id="specimen"><div id="navigation"></div></div><section id="navigation-scroll-area" tabindex="0" aria-label="示例正文滚动区"><article id="nav-section-intro" tabindex="-1"><h2>概览</h2><p>可滚动的真实定位目标。</p></article><article id="nav-section-usage" tabindex="-1"><h2>使用方式</h2></article><article id="nav-section-api" tabindex="-1"><h2>参数说明</h2></article></section><output id="event" aria-live="polite">尚未操作</output><details><summary>当前参数 JSON</summary><pre id="json"></pre></details></main><script type="module" src="./navigation-demo.js"></script></body></html>
