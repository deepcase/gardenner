<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GImage 图片</title><link rel="stylesheet" href="../dist/gardener.css"></head><body><main style="max-width:900px;margin:auto;padding:24px"><h1>GImage</h1><p>图片说明、缩放、旋转、翻转与键盘操作。</p><label>适配 <select id="fit"><option>cover</option><option>contain</option><option>fill</option></select></label><div id="image" class="g-image" data-g-media style="margin:20px 0"></div><h2>失败与备用图片</h2><div class="g-image" data-g-media data-g-media-options='{"src":"data:image/png;base64,AA==","fallback":"./media-assets/sea.svg","width":240,"height":150,"alt":"海岸备用图片","showLoader":true}'></div></main><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';const root=document.getElementById('image'),options={src:'./media-assets/mountain.svg',alt:'山间风景',width:240,height:150,title:'山间漫步',description:'点击图片体验预览',footerPosition:'outer',showLoader:true,fit:'cover',items:['mountain','sea','sunset'].map(x=>({src:'./media-assets/'+x+'.svg',alt:x,title:x}))};root.dataset.gMediaOptions=JSON.stringify(options);init(document);document.getElementById('fit').onchange=e=>getInstance(root,'media').setOptions({fit:e.target.value});</script></body></html>
