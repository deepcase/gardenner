<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仪表盘 · 完整示例</title><link rel="stylesheet" href="../dist/gardener.css"><style>body{background:var(--g-color-canvas);color:var(--g-color-text)}main{width:min(1040px,calc(100% - 32px));margin:32px auto;display:grid;grid-template-columns:minmax(0,1fr);overflow-x:clip;gap:32px}main>section{min-width:0}h1{font-size:28px}h2{font-size:20px}.dashboard-demo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;margin-top:16px}@media(max-width:700px){.dashboard-demo-grid{grid-template-columns:minmax(0,1fr)}}</style></head><body><main><h1>仪表盘 · 指标、筛选、图表与目标</h1><section><h2>联动经营概览</h2><p>修改周期和团队后点击“应用筛选”，下方图表和营业额会同步使用同一份筛选结果。</p><div id="dashboard-linked-filter"><section class="g-filter-bar" data-g-dashboard data-g-dashboard-options="{&quot;fields&quot;:[{&quot;key&quot;:&quot;period&quot;,&quot;label&quot;:&quot;统计周期&quot;,&quot;type&quot;:&quot;select&quot;,&quot;defaultValue&quot;:&quot;month&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;week&quot;,&quot;label&quot;:&quot;最近 7 天&quot;},{&quot;value&quot;:&quot;month&quot;,&quot;label&quot;:&quot;本月&quot;},{&quot;value&quot;:&quot;quarter&quot;,&quot;label&quot;:&quot;本季度&quot;}]},{&quot;key&quot;:&quot;team&quot;,&quot;label&quot;:&quot;团队&quot;,&quot;type&quot;:&quot;select&quot;,&quot;defaultValue&quot;:&quot;all&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;all&quot;,&quot;label&quot;:&quot;全部团队&quot;},{&quot;value&quot;:&quot;east&quot;,&quot;label&quot;:&quot;华东团队&quot;},{&quot;value&quot;:&quot;south&quot;,&quot;label&quot;:&quot;华南团队&quot;}]},{&quot;key&quot;:&quot;keyword&quot;,&quot;label&quot;:&quot;项目检索&quot;,&quot;type&quot;:&quot;search&quot;,&quot;placeholder&quot;:&quot;输入项目名称&quot;}],&quot;values&quot;:{&quot;period&quot;:&quot;month&quot;,&quot;team&quot;:&quot;all&quot;,&quot;keyword&quot;:&quot;&quot;}}" aria-label="filter-bar"></section></div><div class="dashboard-demo-grid"><div id="dashboard-linked-kpi"><section class="g-kpi" data-g-dashboard data-g-dashboard-options="{&quot;label&quot;:&quot;本月营业额&quot;,&quot;value&quot;:128650.75,&quot;previous&quot;:112340.5,&quot;format&quot;:&quot;currency&quot;,&quot;currency&quot;:&quot;CNY&quot;,&quot;precision&quot;:2,&quot;description&quot;:&quot;已扣除退款，按订单完成时间统计&quot;}" aria-label="本月营业额"></section></div><div id="dashboard-linked-chart"><section class="g-chart" data-g-dashboard data-g-dashboard-options="{&quot;title&quot;:&quot;营收与成本趋势&quot;,&quot;description&quot;:&quot;最近六个月营收与成本，单位万元&quot;,&quot;categories&quot;:[&quot;1 月&quot;,&quot;2 月&quot;,&quot;3 月&quot;,&quot;4 月&quot;,&quot;5 月&quot;,&quot;6 月&quot;],&quot;series&quot;:[{&quot;id&quot;:&quot;revenue&quot;,&quot;label&quot;:&quot;营收&quot;,&quot;values&quot;:[42,56,51,73,81,96]},{&quot;id&quot;:&quot;cost&quot;,&quot;label&quot;:&quot;成本&quot;,&quot;values&quot;:[28,35,32,45,49,57]}],&quot;precision&quot;:1,&quot;filename&quot;:&quot;revenue.csv&quot;}" aria-label="营收与成本趋势"></section></div></div></section><section id="kpi-stat"><h2>kpi-stat</h2><label>变体 <select data-dashboard-variant="kpi-stat"><option value="">默认</option><option>compact</option><option>comfortable</option><option>borderless</option><option>horizontal</option><option>centered</option><option>accent</option></select></label><section class="g-kpi" data-demo-component data-g-dashboard data-g-dashboard-options="{&quot;label&quot;:&quot;本月营业额&quot;,&quot;value&quot;:128650.75,&quot;previous&quot;:112340.5,&quot;format&quot;:&quot;currency&quot;,&quot;currency&quot;:&quot;CNY&quot;,&quot;precision&quot;:2,&quot;description&quot;:&quot;已扣除退款，按订单完成时间统计&quot;}" aria-label="本月营业额"></section></section>
<section id="filter-bar"><h2>filter-bar</h2><label>变体 <select data-dashboard-variant="filter-bar"><option value="">默认</option><option>compact</option><option>comfortable</option><option>borderless</option><option>vertical</option><option>sticky</option><option>inline</option></select></label><section class="g-filter-bar" data-demo-component data-g-dashboard data-g-dashboard-options="{&quot;fields&quot;:[{&quot;key&quot;:&quot;period&quot;,&quot;label&quot;:&quot;统计周期&quot;,&quot;type&quot;:&quot;select&quot;,&quot;defaultValue&quot;:&quot;month&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;week&quot;,&quot;label&quot;:&quot;最近 7 天&quot;},{&quot;value&quot;:&quot;month&quot;,&quot;label&quot;:&quot;本月&quot;},{&quot;value&quot;:&quot;quarter&quot;,&quot;label&quot;:&quot;本季度&quot;}]},{&quot;key&quot;:&quot;team&quot;,&quot;label&quot;:&quot;团队&quot;,&quot;type&quot;:&quot;select&quot;,&quot;defaultValue&quot;:&quot;all&quot;,&quot;options&quot;:[{&quot;value&quot;:&quot;all&quot;,&quot;label&quot;:&quot;全部团队&quot;},{&quot;value&quot;:&quot;east&quot;,&quot;label&quot;:&quot;华东团队&quot;},{&quot;value&quot;:&quot;south&quot;,&quot;label&quot;:&quot;华南团队&quot;}]},{&quot;key&quot;:&quot;keyword&quot;,&quot;label&quot;:&quot;项目检索&quot;,&quot;type&quot;:&quot;search&quot;,&quot;placeholder&quot;:&quot;输入项目名称&quot;}],&quot;values&quot;:{&quot;period&quot;:&quot;month&quot;,&quot;team&quot;:&quot;all&quot;,&quot;keyword&quot;:&quot;&quot;}}" aria-label="filter-bar"></section></section>
<section id="chart-container"><h2>chart-container</h2><label>变体 <select data-dashboard-variant="chart-container"><option value="">默认</option><option>compact</option><option>comfortable</option><option>borderless</option><option>line</option><option>area</option><option>bar</option><option>donut</option></select></label><section class="g-chart" data-demo-component data-g-dashboard data-g-dashboard-options="{&quot;title&quot;:&quot;营收与成本趋势&quot;,&quot;description&quot;:&quot;最近六个月营收与成本，单位万元&quot;,&quot;categories&quot;:[&quot;1 月&quot;,&quot;2 月&quot;,&quot;3 月&quot;,&quot;4 月&quot;,&quot;5 月&quot;,&quot;6 月&quot;],&quot;series&quot;:[{&quot;id&quot;:&quot;revenue&quot;,&quot;label&quot;:&quot;营收&quot;,&quot;values&quot;:[42,56,51,73,81,96]},{&quot;id&quot;:&quot;cost&quot;,&quot;label&quot;:&quot;成本&quot;,&quot;values&quot;:[28,35,32,45,49,57]}],&quot;precision&quot;:1,&quot;filename&quot;:&quot;revenue.csv&quot;}" aria-label="营收与成本趋势"></section></section>
<section id="kpi-group"><h2>kpi-group</h2><label>变体 <select data-dashboard-variant="kpi-group"><option value="">默认</option><option>compact</option><option>comfortable</option><option>borderless</option><option>divided</option><option>stacked</option></select></label><section class="g-kpi-group" data-demo-component data-g-dashboard data-g-dashboard-options="{&quot;metrics&quot;:[{&quot;label&quot;:&quot;活跃客户&quot;,&quot;value&quot;:2860,&quot;previous&quot;:2400,&quot;unit&quot;:&quot;户&quot;},{&quot;label&quot;:&quot;成交订单&quot;,&quot;value&quot;:1368,&quot;previous&quot;:1200,&quot;unit&quot;:&quot;笔&quot;},{&quot;label&quot;:&quot;转化率&quot;,&quot;value&quot;:0.286,&quot;previous&quot;:0.24,&quot;format&quot;:&quot;percent&quot;,&quot;precision&quot;:1},{&quot;label&quot;:&quot;响应时间&quot;,&quot;value&quot;:182,&quot;previous&quot;:240,&quot;inverse&quot;:true,&quot;unit&quot;:&quot;ms&quot;}]}" aria-label="kpi-group"></section></section>
<section id="dashboard-widget"><h2>dashboard-widget</h2><label>变体 <select data-dashboard-variant="dashboard-widget"><option value="">默认</option><option>compact</option><option>comfortable</option><option>borderless</option><option>flat</option><option>accent</option></select></label><section class="g-dashboard-widget" data-demo-component data-g-dashboard data-g-dashboard-options="{&quot;title&quot;:&quot;团队协作摘要&quot;,&quot;collapsible&quot;:true}" aria-label="团队协作摘要"><p>本周已交付 8 项任务，另有 3 项正在进行。</p><label>交接备注<input class="g-input" value="周五安排验收" /></label><ul><li>设计变量完成评审</li><li>移动端适配进入验收</li></ul></section></section>
<section id="goal-tracker"><h2>goal-tracker</h2><label>变体 <select data-dashboard-variant="goal-tracker"><option value="">默认</option><option>compact</option><option>comfortable</option><option>borderless</option><option>horizontal</option><option>centered</option></select></label><section class="g-goal-tracker" data-demo-component data-g-dashboard data-g-dashboard-options="{&quot;title&quot;:&quot;季度签约目标&quot;,&quot;value&quot;:780000,&quot;target&quot;:1000000,&quot;unit&quot;:&quot;元&quot;,&quot;precision&quot;:0}" aria-label="季度签约目标"></section></section>
<section id="gauge-chart"><h2>gauge-chart</h2><label>变体 <select data-dashboard-variant="gauge-chart"><option value="">默认</option><option>compact</option><option>comfortable</option><option>borderless</option><option>semicircle</option><option>ring</option></select></label><section class="g-gauge-chart" data-demo-component data-g-dashboard data-g-dashboard-options="{&quot;title&quot;:&quot;服务健康评分&quot;,&quot;value&quot;:82,&quot;min&quot;:0,&quot;max&quot;:100,&quot;unit&quot;:&quot;分&quot;,&quot;thresholds&quot;:[{&quot;value&quot;:0,&quot;tone&quot;:&quot;danger&quot;},{&quot;value&quot;:60,&quot;tone&quot;:&quot;warning&quot;},{&quot;value&quot;:80,&quot;tone&quot;:&quot;success&quot;}]}" aria-label="服务健康评分"></section></section><fieldset><legend>参数组合</legend><label>尺寸 <select data-dashboard-param="size"><option value="">默认</option><option>small</option><option>medium</option><option>large</option></select></label><label>边框 <select data-dashboard-param="bordered"><option value="">默认</option><option>true</option><option>false</option></select></label><label>指标列数 <select data-dashboard-param="columns"><option value="">默认</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>标题 <select data-dashboard-param="showHeader"><option value="">默认</option><option>true</option><option>false</option></select></label><label>图例 <select data-dashboard-param="showLegend"><option value="">默认</option><option>true</option><option>false</option></select></label><label>网格线 <select data-dashboard-param="showGrid"><option value="">默认</option><option>true</option><option>false</option></select></label><label>坐标文字 <select data-dashboard-param="showAxisLabels"><option value="">默认</option><option>true</option><option>false</option></select></label><label>数据点 <select data-dashboard-param="showMarkers"><option value="">默认</option><option>true</option><option>false</option></select></label><label>数据表入口 <select data-dashboard-param="tableVisible"><option value="">默认</option><option>true</option><option>false</option></select></label><label>趋势 <select data-dashboard-param="showTrend"><option value="">默认</option><option>true</option><option>false</option></select></label><label>指标说明 <select data-dashboard-param="showDescription"><option value="">默认</option><option>true</option><option>false</option></select></label><label>目标值 <select data-dashboard-param="showTarget"><option value="">默认</option><option>true</option><option>false</option></select></label><label>剩余目标 <select data-dashboard-param="showRemaining"><option value="">默认</option><option>true</option><option>false</option></select></label><label>仪表范围 <select data-dashboard-param="showRange"><option value="">默认</option><option>true</option><option>false</option></select></label><label>数值 <select data-dashboard-param="showValue"><option value="">默认</option><option>true</option><option>false</option></select></label><label>应用筛选 <select data-dashboard-param="showApply"><option value="">默认</option><option>true</option><option>false</option></select></label><label>重置筛选 <select data-dashboard-param="showReset"><option value="">默认</option><option>true</option><option>false</option></select></label><label>面板最大高度 <select data-dashboard-param="maxHeight"><option value="">默认</option><option>320</option><option>480</option><option>640</option></select></label><label>数据表高度 <select data-dashboard-param="tableHeight"><option value="">默认</option><option>120</option><option>240</option><option>480</option></select></label><label>数据点半径 <select data-dashboard-param="pointRadius"><option value="">默认</option><option>2</option><option>4</option><option>8</option></select></label><label>曲线线宽 <select data-dashboard-param="lineWidth"><option value="">默认</option><option>1</option><option>2</option><option>4</option></select></label><label>圆环宽度 <select data-dashboard-param="donutWidth"><option value="">默认</option><option>12</option><option>28</option><option>40</option></select></label><label>加载超时 <select data-dashboard-param="serviceTimeout"><option value="">默认</option><option>200</option><option>1000</option><option>60000</option></select></label></fieldset><output id="result" aria-live="polite"></output></main><script type="module">import {init,getInstance} from "../dist/gardener.runtime.js";
function installDashboardDemo(root,api){
 if(!api)return;let attempt=0;const mode=root.dataset.demoDashboardService||'success';
 if(mode!=='none')api.setOptions({...(mode==='timeout'?{serviceTimeout:200}:{}),load:async({signal})=>{attempt++;if(mode==='timeout')await new Promise(()=>{});else await new Promise((resolve,reject)=>{const timer=setTimeout(resolve,150);signal.addEventListener('abort',()=>{clearTimeout(timer);reject(signal.reason);},{once:true});});if(mode==='retry'&&attempt===1)throw Error('本地服务暂不可用，请重试');return {value:94};}});
 const controls=document.createElement('div');controls.className='g-flex g-gap-2';controls.dataset.dashboardServiceControls='';
 for(const [label="",name="load"]of [['加载本地数据','load'],['取消加载','cancel']]){const button=document.createElement('button');button.type='button';button.className='g-btn g-btn-outline';button.textContent=label;button.dataset.dashboardServiceAction=name;button.addEventListener('click',()=>api[name]());controls.append(button);}root.after(controls);
}
init(document);for(const root of document.querySelectorAll("[data-g-dashboard]"))installDashboardDemo(root,getInstance(root,"dashboard"));for(const select of document.querySelectorAll("[data-dashboard-variant]")){const root=document.getElementById(select.dataset.dashboardVariant).querySelector("[data-g-dashboard]"),base=root.className;select.addEventListener("change",()=>root.className=base+(select.value?" "+base+"-"+select.value:""));}for(const select of document.querySelectorAll("[data-dashboard-param]"))select.addEventListener("change",()=>{const v=select.value,patch={[select.dataset.dashboardParam]:v===""?undefined:v==="true"?true:v==="false"?false:Number.isFinite(Number(v))?Number(v):v};for(const root of document.querySelectorAll("[data-g-dashboard]"))getInstance(root,"dashboard").setOptions(patch);});document.addEventListener("gardener:change",e=>document.querySelector("#result").textContent=JSON.stringify(e.detail.value));const chart={"title":"营收与成本趋势","description":"最近六个月营收与成本，单位万元","categories":["1 月","2 月","3 月","4 月","5 月","6 月"],"series":[{"id":"revenue","label":"营收","values":[42,56,51,73,81,96]},{"id":"cost","label":"成本","values":[28,35,32,45,49,57]}],"precision":1,"filename":"revenue.csv"};document.querySelector("#dashboard-linked-filter").addEventListener("gardener:change",event=>{const values=event.detail.value.filters;const selected=chart.series.filter(s=>!values.keyword||s.label.includes(values.keyword.trim()));const factor=(selected.length?1:0)*(values.period==="week"?.25:values.period==="quarter"?3:1)*(values.team==="all"?1:.6);getInstance(document.querySelector("#dashboard-linked-kpi [data-g-dashboard]"),"dashboard").setOptions({value:128650.75*factor});getInstance(document.querySelector("#dashboard-linked-chart [data-g-dashboard]"),"dashboard").setOptions({series:selected.map(s=>({...s,values:s.values.map(v=>Math.round(v*factor*10)/10)}))});});</script></body></html>
