<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GStatistic</title><link rel="stylesheet" href="../dist/gardener.css"><style>main{max-width:800px;margin:auto;padding:24px}.stage{display:flex;flex-wrap:wrap;gap:32px;margin-block:24px;padding:24px;border:1px solid var(--g-color-border)}.stage>.g-statistic{min-width:0;max-width:100%}button,select{font:inherit}output{color:var(--g-color-text)}</style></head><body><main><h1>GStatistic</h1><label>精度 <select id="precision"><option>0</option><option>1</option><option selected>2</option><option>3</option></select></label><label><input id="group" type="checkbox" checked>千分位</label><div class="stage"><div class="g-statistic" id="statistic" data-g-data-display></div><div class="g-statistic" id="countdown" data-g-data-display></div></div><button type="button" class="g-btn" id="increase">增加 2500</button><button type="button" class="g-btn" id="restart">倒计时 3 秒</button><output id="result" aria-live="polite"></output></main><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';const root=document.getElementById('statistic'),countdown=document.getElementById('countdown');let value=26842.75;root.dataset.gDataOptions=JSON.stringify({title:'本月收入',value,precision:2,showGroupSeparator:true,prefix:'¥',extra:'五端共享数字格式'});countdown.dataset.gDataOptions=JSON.stringify({title:'活动倒计时',mode:'countdown',value:Date.now()+60000,start:false});init(document);const api=getInstance(root,'data-display');document.getElementById('precision').onchange=e=>api.setOptions({precision:Number(e.target.value)});document.getElementById('group').onchange=e=>api.setOptions({showGroupSeparator:e.target.checked});document.getElementById('increase').onclick=()=>api.setOptions({value:value+=2500,animation:true,animationDuration:600});document.getElementById('restart').onclick=()=>{document.getElementById('result').textContent='';getInstance(countdown,'data-display').setOptions({value:Date.now()+3000,start:true});};countdown.addEventListener('gardener:complete',()=>document.getElementById('result').textContent='倒计时已结束');</script></body></html>
