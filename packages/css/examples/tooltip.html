<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTooltip 参数演示</title><link rel="stylesheet" href="../dist/gardener.css"></head><body><main style="padding:48px 24px;font:14px/1.5715 var(--g-font-sans)"><h1>GTooltip</h1><label>位置 <select id="position"><option>top</option><option>bottom</option><option>left</option><option>right</option></select></label><label><input id="mini" type="checkbox">Mini</label><div style="padding:48px 0"><div id="tooltip" data-g-tooltip><button type="button" data-g-tooltip-trigger>查看提示</button><div data-g-tooltip-content hidden></div></div></div><output aria-live="polite">已关闭</output></main><script type="module">import{init}from'../dist/gardener.runtime.js';const root=document.getElementById('tooltip');let options={content:'这是一条补充说明',trigger:'click'};function set(p){options={...options,...p};root.dataset.gOverlayOptions=JSON.stringify(options)}set({});init(root);document.getElementById('position').onchange=e=>set({position:e.target.value});document.getElementById('mini').onchange=e=>set({mini:e.target.checked});root.addEventListener('gardener:change',e=>document.querySelector('output').textContent=e.detail.value?'已打开':'已关闭');</script></body></html>
