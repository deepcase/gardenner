<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTree 参数演示</title><link rel="stylesheet" href="../dist/gardener.css"></head><body><main style="padding:24px;font:14px/1.5715 var(--g-font-sans)"><h1>GTree</h1><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px"><label>尺寸 <select id="size"><option>mini</option><option>small</option><option selected>medium</option><option>large</option></select></label><label><input id="line" type="checkbox">连接线</label><label>搜索 <input id="search" type="search"></label></div><div id="tree" class="g-tree" data-g-tree></div><output aria-live="polite" style="display:block;margin-top:16px;overflow-wrap:anywhere">尚未勾选</output></main><script type="module">import{init}from'../dist/gardener.runtime.js';const root=document.getElementById('tree');let options={data:[{"key":"docs","title":"项目文档","children":[{"key":"guide","title":"使用指南"},{"key":"api","title":"API 参考"}]},{"key":"design","title":"设计资源"}],checkable:true,label:'项目资料'};function set(p){options={...options,...p};root.dataset.gTreeOptions=JSON.stringify(options)}set({});init(root);document.getElementById('size').onchange=e=>set({size:e.target.value});document.getElementById('line').onchange=e=>set({showLine:e.target.checked});document.getElementById('search').oninput=e=>set({searchValue:e.target.value});root.addEventListener('gardener:change',e=>document.querySelector('output').textContent=JSON.stringify({selected:e.detail.selectedKeys,checked:e.detail.checkedKeys,half:e.detail.halfCheckedKeys}));</script></body></html>
