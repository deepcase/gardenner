<!doctype html>
<html
  lang="zh-CN"
  data-g-theme="green"
  data-g-platform="mobile"
  data-g-density="touch"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Gardenerim 移动分类</title>
    <link rel="stylesheet" href="../dist/gardener.css" />
  </head>
  <body class="g-mobile-page">
    <header class="g-mobile-topbar">
      <button class="g-btn g-btn-ghost g-btn-icon" aria-label="返回">←</button
      ><input
        class="g-input"
        type="search"
        aria-label="搜索商品"
        placeholder="搜索商品"
      /><button class="g-btn g-btn-ghost g-btn-icon" aria-label="购物车">
        袋
      </button>
    </header>
    <main class="g-mobile-category">
      <nav class="g-mobile-category-rail" aria-label="商品分类">
        <button class="g-mobile-category-link" aria-current="page">推荐</button
        ><button class="g-mobile-category-link">办公</button
        ><button class="g-mobile-category-link">家居</button
        ><button class="g-mobile-category-link">数码</button
        ><button class="g-mobile-category-link">服务</button>
      </nav>
      <section class="g-mobile-category-content">
        <h2 class="g-text-lg g-mb-4">热门分类</h2>
        <div class="g-mobile-category-grid">
          <a class="g-mobile-category-item" href="#"
            ><img
              alt="笔记本电脑"
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
            /><span>电脑</span></a
          >
          <a class="g-mobile-category-item" href="#"
            ><img
              alt="办公桌"
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
            /><span>办公</span></a
          >
          <a class="g-mobile-category-item" href="#"
            ><img
              alt="智能设备"
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
            /><span>智能</span></a
          >
        </div>
      </section>
    </main>
  </body>
</html>
