<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GList</title><link rel="stylesheet" href="../dist/gardener.css"></head><body><main style="max-width:800px;margin:auto;padding:20px"><h1>GList</h1><label>尺寸<select id="size"><option>small</option><option selected>medium</option><option>large</option></select></label><div class="g-list" id="list" data-g-data-display></div><output id="result"></output></main><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';const root=document.getElementById('list');root.dataset.gDataOptions=JSON.stringify({header:'项目列表',data:Array.from({length:25},(_,i)=>({id:i,title:'项目 '+(i+1),description:'跨框架组件开发',actions:[{key:'view',label:'查看'}]})),paginationProps:{defaultPageSize:5,pageSizeOptions:[5,10,20],showPageSize:true,showTotal:true}});init(root);document.getElementById('size').onchange=e=>getInstance(root,'data-display').setOptions({size:e.target.value});root.addEventListener('gardener:action',e=>{if(e.detail.reason==='itemAction')document.getElementById('result').textContent='查看项目 '+e.detail.key});</script></body></html>
