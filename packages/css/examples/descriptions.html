<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDescriptions</title><link rel="stylesheet" href="../dist/gardener.min.css"><style>body{background:var(--g-color-background);color:var(--g-color-text);font:14px/22px sans-serif}main{width:min(900px,calc(100% - 32px));margin:32px auto}section{margin:28px 0}h1{font-size:28px}h2{font-size:20px}.controls{display:flex;gap:12px;flex-wrap:wrap}select{font:inherit}</style></head><body><main><h1>GDescriptions</h1><div class="controls"><label>布局<select id="layout"><option>horizontal</option><option>vertical</option><option>inline-horizontal</option><option>inline-vertical</option></select></label><label>尺寸<select id="size"><option value="">默认</option><option>mini</option><option>small</option><option>medium</option><option>large</option></select></label><label><input id="border" type="checkbox">边框</label><label><input id="dark" type="checkbox">深色</label></div><section id="basic"><h2>基础描述</h2><div class="g-descriptions" data-g-data-display data-g-data-options='{"data":[{"key":"name","label":"项目名称","value":"Gardener Design"},{"key":"owner","label":"负责人","value":"林晓"},{"key":"version","label":"版本","value":"2.2.0"},{"key":"status","label":"状态","value":"已发布"},{"key":"quantity","label":"未完成任务","value":0},{"key":"notes","label":"备注","value":null}],"label":"基础描述"}'></div></section><section id="bordered"><h2>带边框</h2><div class="g-descriptions" data-g-data-display data-g-data-options='{"data":[{"key":"name","label":"项目名称","value":"Gardener Design"},{"key":"owner","label":"负责人","value":"林晓"},{"key":"version","label":"版本","value":"2.2.0"},{"key":"status","label":"状态","value":"已发布"},{"key":"quantity","label":"未完成任务","value":0},{"key":"notes","label":"备注","value":null}],"bordered":true,"label":"带边框"}'></div></section><section id="vertical"><h2>垂直布局</h2><div class="g-descriptions" data-g-data-display data-g-data-options='{"data":[{"key":"name","label":"项目名称","value":"Gardener Design"},{"key":"owner","label":"负责人","value":"林晓"},{"key":"version","label":"版本","value":"2.2.0"},{"key":"status","label":"状态","value":"已发布"},{"key":"quantity","label":"未完成任务","value":0},{"key":"notes","label":"备注","value":null}],"layout":"vertical","bordered":true,"label":"垂直布局"}'></div></section><section id="inline-horizontal"><h2>行内水平布局</h2><div class="g-descriptions" data-g-data-display data-g-data-options='{"data":[{"key":"name","label":"项目名称","value":"Gardener Design"},{"key":"owner","label":"负责人","value":"林晓"},{"key":"version","label":"版本","value":"2.2.0"},{"key":"status","label":"状态","value":"已发布"},{"key":"quantity","label":"未完成任务","value":0},{"key":"notes","label":"备注","value":null}],"layout":"inline-horizontal","label":"行内水平布局"}'></div></section><section id="inline-vertical"><h2>行内垂直布局</h2><div class="g-descriptions" data-g-data-display data-g-data-options='{"data":[{"key":"name","label":"项目名称","value":"Gardener Design"},{"key":"owner","label":"负责人","value":"林晓"},{"key":"version","label":"版本","value":"2.2.0"},{"key":"status","label":"状态","value":"已发布"},{"key":"quantity","label":"未完成任务","value":0},{"key":"notes","label":"备注","value":null}],"layout":"inline-vertical","bordered":true,"label":"行内垂直布局"}'></div></section><section id="span"><h2>跨列</h2><div class="g-descriptions" data-g-data-display data-g-data-options='{"data":[{"label":"项目","value":"Gardener","span":2},{"label":"版本","value":"2.1"},{"label":"说明","value":"一条描述占据整行，余下的空间由行末项目填充。","span":3}],"column":3,"label":"跨列"}'></div></section><section id="align"><h2>标签与值分别对齐</h2><div class="g-descriptions" data-g-data-display data-g-data-options='{"data":[{"key":"name","label":"项目名称","value":"Gardener Design"},{"key":"owner","label":"负责人","value":"林晓"},{"key":"version","label":"版本","value":"2.2.0"},{"key":"status","label":"状态","value":"已发布"},{"key":"quantity","label":"未完成任务","value":0},{"key":"notes","label":"备注","value":null}],"bordered":true,"align":{"label":"right","value":"left"},"labelStyle":{"width":"110px"},"valueStyle":{"color":"var(--g-color-primary-text)"},"label":"标签与值分别对齐"}'></div></section><section id="responsive"><h2>响应式列数</h2><div class="g-descriptions" data-g-data-display data-g-data-options='{"data":[{"key":"name","label":"项目名称","value":"Gardener Design"},{"key":"owner","label":"负责人","value":"林晓"},{"key":"version","label":"版本","value":"2.2.0"},{"key":"status","label":"状态","value":"已发布"},{"key":"quantity","label":"未完成任务","value":0},{"key":"notes","label":"备注","value":null}],"bordered":true,"column":{"xs":1,"sm":2,"lg":3},"tableLayout":"fixed","label":"响应式列数"}'></div></section></main><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';init(document);window.descriptions=getInstance(document.querySelector('#basic .g-descriptions'),'data-display');for(const key of ['layout','size'])document.getElementById(key).onchange=e=>window.descriptions.setOptions({[key]:e.target.value||undefined});document.getElementById('border').onchange=e=>window.descriptions.setOptions({bordered:e.target.checked});document.getElementById('dark').onchange=e=>document.documentElement.setAttribute('data-g-mode',e.target.checked?'dark':'light');</script></body></html>
