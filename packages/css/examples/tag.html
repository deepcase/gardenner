<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTag 参数演示</title><link rel="stylesheet" href="../dist/gardener.css"></head><body><main style="padding:24px;font:14px/1.6 var(--g-font-sans)"><h1>GTag 标签</h1><label>尺寸 <select id="size"><option>mini</option><option>small</option><option selected>medium</option><option>large</option></select></label><button type="button" id="restore">恢复标签</button><div style="padding-block:24px"><span id="tag" class="g-tag" data-g-tag data-g-tag-options='{"text":"项目标签","color":"arcoblue","checkable":true,"closable":true,"closeLabel":"关闭标签"}'></span></div><output aria-live="polite">尚未操作</output></main><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';init(document);const tag=document.getElementById('tag'),api=getInstance(tag,'tag');document.getElementById('size').onchange=e=>api.setOptions({size:e.target.value});document.getElementById('restore').onclick=()=>api.setOptions({visible:true});tag.addEventListener('gardener:check',e=>document.querySelector('output').textContent=e.detail.checked?'已选中':'未选中');tag.addEventListener('gardener:close',()=>{api.setOptions({visible:false});document.querySelector('output').textContent='已关闭'});</script></body></html>
