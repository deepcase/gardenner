<!doctype html>
<html
  lang="zh-CN"
  data-g-theme="violet"
  data-g-platform="electron"
  data-g-density="compact"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gardenerim 桌面 CMS</title>
    <link rel="stylesheet" href="../dist/gardener.css" />
  </head>
  <body>
    <main class="g-desktop-shell">
      <header class="g-titlebar">
        <div class="g-titlebar-start">
          <nav class="g-menubar g-menubar-integrated" data-g-roving-nav role="menubar" aria-label="应用菜单">
            <ul class="g-menubar-list" role="none">
              <li role="none"><div class="g-menubar-menu g-dropdown" data-g-dropdown><button type="button" class="g-menubar-item" role="menuitem" data-g-dropdown-trigger>文件<span class="g-menubar-item-caret" aria-hidden="true"></span></button><ul class="g-menubar-menu-panel g-dropdown-menu g-menu" data-g-dropdown-menu hidden><li><button type="button" class="g-menubar-menu-item g-menu-item" role="menuitem">新建页面<kbd class="g-menubar-menu-item-shortcut">Ctrl N</kbd></button></li><li><button type="button" class="g-menubar-menu-item g-menu-item" role="menuitem">保存<kbd class="g-menubar-menu-item-shortcut">Ctrl S</kbd></button></li></ul></div></li>
              <li role="none"><div class="g-menubar-menu g-dropdown" data-g-dropdown><button type="button" class="g-menubar-item" role="menuitem" data-g-dropdown-trigger>编辑<span class="g-menubar-item-caret" aria-hidden="true"></span></button><ul class="g-menubar-menu-panel g-dropdown-menu g-menu" data-g-dropdown-menu hidden><li><button type="button" class="g-menubar-menu-item g-menu-item" role="menuitem">撤销<kbd class="g-menubar-menu-item-shortcut">Ctrl Z</kbd></button></li><li><button type="button" class="g-menubar-menu-item g-menu-item" role="menuitem">重做<kbd class="g-menubar-menu-item-shortcut">Ctrl Shift Z</kbd></button></li></ul></div></li>
            </ul>
          </nav>
        </div>
        <div class="g-titlebar-title">Gardenerim Studio — 企业官网</div>
        <div class="g-titlebar-end">
          <a class="g-btn g-btn-ghost" href="cms-lab.html">CMS 完整交互演示</a>
          <div class="g-window-controls">
            <button type="button"
              class="g-window-button"
              data-g-window-action="minimize"
              aria-label="最小化"
            >
              −</button
            ><button type="button"
              class="g-window-button"
              data-g-window-action="maximize"
              aria-label="最大化"
            >
              □</button
            ><button type="button"
              class="g-window-button"
              data-g-window-action="close"
              aria-label="关闭"
            >
              ×
            </button>
          </div>
        </div>
      </header>
      <nav class="g-activitybar" data-g-roving-nav data-g-orientation="vertical" aria-label="主工具">
        <header class="g-activitybar-header"><a class="g-activitybar-brand" href="#cms-workbench" aria-label="Gardenerim CMS">G</a></header>
        <div class="g-activitybar-group">
          <ul class="g-activitybar-list">
            <li><button type="button" class="g-activitybar-item is-active" aria-current="page" title="页面"><span class="g-activitybar-icon" aria-hidden="true">页</span><span class="g-activitybar-label">页面</span></button></li>
            <li><button type="button" class="g-activitybar-item" title="媒体"><span class="g-activitybar-icon" aria-hidden="true">图</span><span class="g-activitybar-label">媒体</span><span class="g-activitybar-badge" role="status" aria-label="2 个媒体任务">2</span></button></li>
            <li><button type="button" class="g-activitybar-item" aria-disabled="true" title="扩展不可用"><span class="g-activitybar-icon" aria-hidden="true">◇</span><span class="g-activitybar-label">扩展不可用</span></button></li>
          </ul>
        </div>
        <footer class="g-activitybar-footer"><button type="button" class="g-activitybar-action" title="设置"><span class="g-activitybar-icon" aria-hidden="true">设</span><span class="g-activitybar-label">设置</span></button></footer>
      </nav>
      <section id="cms-workbench" class="g-workbench">
        <aside class="g-workbench-sidebar">
          <header class="g-cms-panel-header">
            <strong>页面树</strong
            ><button type="button" class="g-btn g-btn-ghost g-btn-icon" aria-label="添加页面">
              +
            </button>
          </header>
          <div class="g-p-3">
            <div class="g-tree-item">首页</div>
            <div class="g-tree-item">产品</div>
            <div class="g-tree-item">关于我们</div>
          </div>
        </aside>
        <div class="g-workbench-editor">
          <nav class="g-editor-tabs">
            <button type="button" class="g-editor-tab is-active">首页</button
            ><button type="button" class="g-editor-tab">全局导航</button>
          </nav>
          <div class="g-cms-canvas">
            <article class="g-cms-device">
              <section class="g-cms-block is-selected g-p-8">
                <span class="g-cms-block-handle">Hero · 拖动</span
                ><span class="g-badge">新版</span>
                <h1 class="g-mt-4">让内容团队更快发布</h1>
                <p class="g-text-muted g-mt-3">
                  这是桌面端、Tauri 与 Electron 共用的可视化 CMS 配方。
                </p>
                <button type="button" class="g-btn g-btn-primary g-mt-5">开始使用</button>
              </section>
            </article>
          </div>
          <footer class="g-publish-bar">
            <span class="g-text-sm g-text-muted">所有更改已保存</span
            ><button type="button" class="g-btn g-btn-primary">发布</button>
          </footer>
        </div>
      </section>
      <aside class="g-desktop-inspector">
        <header class="g-cms-panel-header"><strong>属性</strong></header>
        <div class="g-p-3 g-grid g-gap-3">
          <label class="g-field"
            ><span class="g-label">标题</span
            ><input class="g-input" value="让内容团队更快发布" /></label
          ><label class="g-field"
            ><span class="g-label">内边距</span
            ><select class="g-select">
              <option>宽松</option>
              <option>标准</option>
            </select></label
          >
        </div>
      </aside>
      <footer class="g-desktop-statusbar">
        <div class="g-desktop-status-group">
          <span class="g-desktop-status-item">本地桌面布局演示</span>
        </div>
        <div class="g-desktop-status-group">
          <span class="g-desktop-status-item">zh-CN</span
          ><span class="g-desktop-status-item">100%</span>
        </div>
      </footer>
    </main>
    <script type="module">
      import { bindElectronWindowControls } from "../dist/gardener.electron.js";
      bindElectronWindowControls();
    </script>
  </body>
</html>
