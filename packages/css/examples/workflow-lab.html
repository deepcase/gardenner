<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工作流 组件完整演示</title><link rel="stylesheet" href="../dist/gardener.css"><link rel="stylesheet" href="workflow-demo.css"></head><body><main style="max-width:1100px;margin:auto;padding:24px"><h1>工作流 · 8 个组件 / 32 个变体</h1><p>本地模拟服务，演示提交、审批与运行请求，不执行真实业务。</p><section data-example="onboarding"><h2>onboarding</h2><label>变体<select aria-label="onboarding 变体"><option>guided</option><option>cards</option><option>checklist</option><option>compact</option></select></label><div data-stage><div data-demo-component class="g-onboarding g-onboarding-guided" data-g-workflow data-g-workflow-options="{&quot;kind&quot;:&quot;onboarding&quot;,&quot;mode&quot;:&quot;guided&quot;,&quot;title&quot;:&quot;新手引导&quot;,&quot;description&quot;:&quot;可配置的工作流数据、交互与服务确认。&quot;,&quot;defaultValue&quot;:{&quot;version&quot;:1},&quot;steps&quot;:[{&quot;id&quot;:&quot;profile&quot;,&quot;title&quot;:&quot;基本信息&quot;,&quot;description&quot;:&quot;配置工作空间的名称与负责人。&quot;,&quot;fields&quot;:[{&quot;id&quot;:&quot;name&quot;,&quot;label&quot;:&quot;工作空间名称&quot;,&quot;required&quot;:true,&quot;value&quot;:&quot;Garden Studio&quot;},{&quot;id&quot;:&quot;email&quot;,&quot;label&quot;:&quot;负责人邮箱&quot;,&quot;type&quot;:&quot;email&quot;,&quot;required&quot;:true,&quot;value&quot;:&quot;team@example.test&quot;}]},{&quot;id&quot;:&quot;preferences&quot;,&quot;title&quot;:&quot;偏好设置&quot;,&quot;optional&quot;:true,&quot;description&quot;:&quot;选择通知方式，可以稍后修改。&quot;,&quot;fields&quot;:[{&quot;id&quot;:&quot;notification&quot;,&quot;label&quot;:&quot;接收流程通知&quot;,&quot;type&quot;:&quot;checkbox&quot;,&quot;value&quot;:true}]},{&quot;id&quot;:&quot;review&quot;,&quot;title&quot;:&quot;确认提交&quot;,&quot;description&quot;:&quot;核对信息后提交，服务端确认后完成引导。&quot;,&quot;content&quot;:&quot;可返回修改前面的步骤。异步提交支持失败重试与取消。&quot;,&quot;fields&quot;:[{&quot;id&quot;:&quot;agree&quot;,&quot;label&quot;:&quot;确认以上信息准确&quot;,&quot;type&quot;:&quot;checkbox&quot;,&quot;required&quot;:true,&quot;value&quot;:false}]}]}"></div></div></section>
<section data-example="wizard-layout"><h2>wizard-layout</h2><label>变体<select aria-label="wizard-layout 变体"><option>sidebar</option><option>top</option><option>vertical</option><option>compact</option></select></label><div data-stage><div data-demo-component class="g-wizard-layout g-wizard-layout-sidebar" data-g-workflow data-g-workflow-options="{&quot;kind&quot;:&quot;wizard-layout&quot;,&quot;mode&quot;:&quot;sidebar&quot;,&quot;title&quot;:&quot;向导布局&quot;,&quot;description&quot;:&quot;可配置的工作流数据、交互与服务确认。&quot;,&quot;defaultValue&quot;:{&quot;version&quot;:1},&quot;steps&quot;:[{&quot;id&quot;:&quot;profile&quot;,&quot;title&quot;:&quot;基本信息&quot;,&quot;description&quot;:&quot;配置工作空间的名称与负责人。&quot;,&quot;fields&quot;:[{&quot;id&quot;:&quot;name&quot;,&quot;label&quot;:&quot;工作空间名称&quot;,&quot;required&quot;:true,&quot;value&quot;:&quot;Garden Studio&quot;},{&quot;id&quot;:&quot;email&quot;,&quot;label&quot;:&quot;负责人邮箱&quot;,&quot;type&quot;:&quot;email&quot;,&quot;required&quot;:true,&quot;value&quot;:&quot;team@example.test&quot;}]},{&quot;id&quot;:&quot;preferences&quot;,&quot;title&quot;:&quot;偏好设置&quot;,&quot;optional&quot;:true,&quot;description&quot;:&quot;选择通知方式，可以稍后修改。&quot;,&quot;fields&quot;:[{&quot;id&quot;:&quot;notification&quot;,&quot;label&quot;:&quot;接收流程通知&quot;,&quot;type&quot;:&quot;checkbox&quot;,&quot;value&quot;:true}]},{&quot;id&quot;:&quot;review&quot;,&quot;title&quot;:&quot;确认提交&quot;,&quot;description&quot;:&quot;核对信息后提交，服务端确认后完成引导。&quot;,&quot;content&quot;:&quot;可返回修改前面的步骤。异步提交支持失败重试与取消。&quot;,&quot;fields&quot;:[{&quot;id&quot;:&quot;agree&quot;,&quot;label&quot;:&quot;确认以上信息准确&quot;,&quot;type&quot;:&quot;checkbox&quot;,&quot;required&quot;:true,&quot;value&quot;:false}]}]}"></div></div></section>
<section data-example="workflow-checklist"><h2>workflow-checklist</h2><label>变体<select aria-label="workflow-checklist 变体"><option>list</option><option>grouped</option><option>cards</option><option>compact</option></select></label><div data-stage><div data-demo-component class="g-workflow-checklist g-workflow-checklist-list" data-g-workflow data-g-workflow-options="{&quot;kind&quot;:&quot;workflow-checklist&quot;,&quot;mode&quot;:&quot;list&quot;,&quot;title&quot;:&quot;工作流任务清单&quot;,&quot;description&quot;:&quot;可配置的工作流数据、交互与服务确认。&quot;,&quot;defaultValue&quot;:{&quot;version&quot;:1},&quot;items&quot;:[{&quot;id&quot;:&quot;profile&quot;,&quot;name&quot;:&quot;补全工作空间资料&quot;,&quot;description&quot;:&quot;设置名称和负责人&quot;,&quot;group&quot;:&quot;开始使用&quot;},{&quot;id&quot;:&quot;invite&quot;,&quot;name&quot;:&quot;邀请团队成员&quot;,&quot;description&quot;:&quot;完成资料后邀请协作者&quot;,&quot;dependsOn&quot;:[&quot;profile&quot;],&quot;group&quot;:&quot;开始使用&quot;},{&quot;id&quot;:&quot;first&quot;,&quot;name&quot;:&quot;创建第一个工作流&quot;,&quot;description&quot;:&quot;完成成员配置后开始协作&quot;,&quot;dependsOn&quot;:[&quot;invite&quot;],&quot;group&quot;:&quot;流程搭建&quot;},{&quot;id&quot;:&quot;learn&quot;,&quot;name&quot;:&quot;了解运行监控&quot;,&quot;description&quot;:&quot;可独立完成的学习任务&quot;,&quot;group&quot;:&quot;学习&quot;}]}"></div></div></section>
<section data-example="workflow-approval"><h2>workflow-approval</h2><label>变体<select aria-label="workflow-approval 变体"><option>timeline</option><option>parallel</option><option>cards</option><option>compact</option></select></label><div data-stage><div data-demo-component class="g-workflow-approval g-workflow-approval-timeline" data-g-workflow data-g-workflow-options="{&quot;kind&quot;:&quot;workflow-approval&quot;,&quot;mode&quot;:&quot;timeline&quot;,&quot;title&quot;:&quot;审批流程&quot;,&quot;description&quot;:&quot;可配置的工作流数据、交互与服务确认。&quot;,&quot;defaultValue&quot;:{&quot;version&quot;:1},&quot;items&quot;:[{&quot;id&quot;:&quot;owner&quot;,&quot;name&quot;:&quot;部门负责人&quot;,&quot;description&quot;:&quot;确认业务需求与预算&quot;},{&quot;id&quot;:&quot;finance&quot;,&quot;name&quot;:&quot;财务审核&quot;,&quot;description&quot;:&quot;检查付款和合规材料&quot;},{&quot;id&quot;:&quot;director&quot;,&quot;name&quot;:&quot;审批主管&quot;,&quot;description&quot;:&quot;最终确认&quot;}],&quot;approvalMode&quot;:&quot;sequential&quot;,&quot;quorum&quot;:2}"></div></div></section>
<section data-example="workflow-builder"><h2>workflow-builder</h2><label>变体<select aria-label="workflow-builder 变体"><option>canvas</option><option>list</option><option>split</option><option>compact</option></select></label><div data-stage><div data-demo-component class="g-workflow-builder g-workflow-builder-canvas" data-g-workflow data-g-workflow-options="{&quot;kind&quot;:&quot;workflow-builder&quot;,&quot;mode&quot;:&quot;canvas&quot;,&quot;title&quot;:&quot;流程编排&quot;,&quot;description&quot;:&quot;可配置的工作流数据、交互与服务确认。&quot;,&quot;defaultValue&quot;:{&quot;version&quot;:1},&quot;nodes&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;name&quot;:&quot;订单创建&quot;,&quot;type&quot;:&quot;trigger&quot;,&quot;description&quot;:&quot;监听已验证的订单事件&quot;},{&quot;id&quot;:&quot;check&quot;,&quot;name&quot;:&quot;检查订单金额&quot;,&quot;type&quot;:&quot;condition&quot;,&quot;description&quot;:&quot;高于阈值进入审批&quot;},{&quot;id&quot;:&quot;approval&quot;,&quot;name&quot;:&quot;负责人审批&quot;,&quot;type&quot;:&quot;approval&quot;},{&quot;id&quot;:&quot;notify&quot;,&quot;name&quot;:&quot;通知仓库&quot;,&quot;type&quot;:&quot;task&quot;},{&quot;id&quot;:&quot;end&quot;,&quot;name&quot;:&quot;流程结束&quot;,&quot;type&quot;:&quot;end&quot;}],&quot;edges&quot;:[{&quot;id&quot;:&quot;a&quot;,&quot;from&quot;:&quot;start&quot;,&quot;to&quot;:&quot;check&quot;},{&quot;id&quot;:&quot;b&quot;,&quot;from&quot;:&quot;check&quot;,&quot;to&quot;:&quot;approval&quot;,&quot;condition&quot;:&quot;amount ≥ 5000&quot;},{&quot;id&quot;:&quot;c&quot;,&quot;from&quot;:&quot;check&quot;,&quot;to&quot;:&quot;notify&quot;,&quot;condition&quot;:&quot;amount &lt; 5000&quot;},{&quot;id&quot;:&quot;d&quot;,&quot;from&quot;:&quot;approval&quot;,&quot;to&quot;:&quot;notify&quot;},{&quot;id&quot;:&quot;e&quot;,&quot;from&quot;:&quot;notify&quot;,&quot;to&quot;:&quot;end&quot;}]}"></div></div></section>
<section data-example="workflow-run-history"><h2>workflow-run-history</h2><label>变体<select aria-label="workflow-run-history 变体"><option>table</option><option>cards</option><option>timeline</option><option>compact</option></select></label><div data-stage><div data-demo-component class="g-workflow-run-history g-workflow-run-history-table" data-g-workflow data-g-workflow-options="{&quot;kind&quot;:&quot;workflow-run-history&quot;,&quot;mode&quot;:&quot;table&quot;,&quot;title&quot;:&quot;运行历史&quot;,&quot;description&quot;:&quot;可配置的工作流数据、交互与服务确认。&quot;,&quot;defaultValue&quot;:{&quot;version&quot;:1},&quot;items&quot;:[{&quot;id&quot;:&quot;run-1042&quot;,&quot;name&quot;:&quot;订单处理 #1042&quot;,&quot;status&quot;:&quot;failed&quot;,&quot;actor&quot;:&quot;系统事件&quot;,&quot;startedAt&quot;:&quot;2026-09-07T01:15:00Z&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;receive&quot;,&quot;title&quot;:&quot;接收订单&quot;,&quot;status&quot;:&quot;success&quot;},{&quot;id&quot;:&quot;check&quot;,&quot;title&quot;:&quot;校验库存&quot;,&quot;status&quot;:&quot;success&quot;},{&quot;id&quot;:&quot;notify&quot;,&quot;title&quot;:&quot;通知仓库&quot;,&quot;status&quot;:&quot;failed&quot;,&quot;description&quot;:&quot;下游服务暂时不可用，可重试。&quot;}],&quot;logs&quot;:[&quot;09:15:00 收到订单 order.created&quot;,&quot;09:15:01 库存校验成功&quot;,&quot;09:15:03 下游服务返回 503，等待重试&quot;]},{&quot;id&quot;:&quot;run-1041&quot;,&quot;name&quot;:&quot;订单处理 #1041&quot;,&quot;status&quot;:&quot;running&quot;,&quot;startedAt&quot;:&quot;2026-09-07T01:10:00Z&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;receive&quot;,&quot;title&quot;:&quot;接收订单&quot;,&quot;status&quot;:&quot;success&quot;},{&quot;id&quot;:&quot;approve&quot;,&quot;title&quot;:&quot;负责人审批&quot;,&quot;status&quot;:&quot;running&quot;}],&quot;logs&quot;:[&quot;09:10:00 收到订单&quot;,&quot;09:10:01 等待人工审批&quot;]},{&quot;id&quot;:&quot;run-1040&quot;,&quot;name&quot;:&quot;订单处理 #1040&quot;,&quot;status&quot;:&quot;success&quot;,&quot;startedAt&quot;:&quot;2026-09-06T12:20:00Z&quot;,&quot;logs&quot;:[&quot;20:20:00 流程完成&quot;]},{&quot;id&quot;:&quot;run-1039&quot;,&quot;name&quot;:&quot;订单处理 #1039&quot;,&quot;status&quot;:&quot;cancelled&quot;,&quot;startedAt&quot;:&quot;2026-09-06T08:00:00Z&quot;,&quot;logs&quot;:[&quot;16:00:00 操作人取消运行&quot;]}],&quot;pageSize&quot;:3}"></div></div></section>
<section data-example="workflow-run-detail"><h2>workflow-run-detail</h2><label>变体<select aria-label="workflow-run-detail 变体"><option>timeline</option><option>steps</option><option>logs</option><option>compact</option></select></label><div data-stage><div data-demo-component class="g-workflow-run-detail g-workflow-run-detail-timeline" data-g-workflow data-g-workflow-options="{&quot;kind&quot;:&quot;workflow-run-detail&quot;,&quot;mode&quot;:&quot;timeline&quot;,&quot;title&quot;:&quot;运行详情&quot;,&quot;description&quot;:&quot;可配置的工作流数据、交互与服务确认。&quot;,&quot;defaultValue&quot;:{&quot;version&quot;:1},&quot;items&quot;:[{&quot;id&quot;:&quot;run-1042&quot;,&quot;name&quot;:&quot;订单处理 #1042&quot;,&quot;status&quot;:&quot;failed&quot;,&quot;actor&quot;:&quot;系统事件&quot;,&quot;startedAt&quot;:&quot;2026-09-07T01:15:00Z&quot;,&quot;steps&quot;:[{&quot;id&quot;:&quot;receive&quot;,&quot;title&quot;:&quot;接收订单&quot;,&quot;status&quot;:&quot;success&quot;},{&quot;id&quot;:&quot;check&quot;,&quot;title&quot;:&quot;校验库存&quot;,&quot;status&quot;:&quot;success&quot;},{&quot;id&quot;:&quot;notify&quot;,&quot;title&quot;:&quot;通知仓库&quot;,&quot;status&quot;:&quot;failed&quot;,&quot;description&quot;:&quot;下游服务暂时不可用，可重试。&quot;}],&quot;logs&quot;:[&quot;09:15:00 收到订单 order.created&quot;,&quot;09:15:01 库存校验成功&quot;,&quot;09:15:03 下游服务返回 503，等待重试&quot;]}]}"></div></div></section>
<section data-example="workflow-trigger"><h2>workflow-trigger</h2><label>变体<select aria-label="workflow-trigger 变体"><option>manual</option><option>schedule</option><option>webhook</option><option>compact</option></select></label><div data-stage><div data-demo-component class="g-workflow-trigger g-workflow-trigger-manual" data-g-workflow data-g-workflow-options="{&quot;kind&quot;:&quot;workflow-trigger&quot;,&quot;mode&quot;:&quot;manual&quot;,&quot;title&quot;:&quot;触发配置&quot;,&quot;description&quot;:&quot;可配置的工作流数据、交互与服务确认。&quot;,&quot;defaultValue&quot;:{&quot;version&quot;:1},&quot;fields&quot;:[{&quot;id&quot;:&quot;environment&quot;,&quot;label&quot;:&quot;运行环境&quot;,&quot;type&quot;:&quot;select&quot;,&quot;required&quot;:true,&quot;value&quot;:&quot;staging&quot;,&quot;options&quot;:[{&quot;id&quot;:&quot;staging&quot;,&quot;label&quot;:&quot;预发布&quot;},{&quot;id&quot;:&quot;production&quot;,&quot;label&quot;:&quot;生产&quot;}]}]}"></div></div></section></main><script type="module">import {init,destroy,getInstance} from "../dist/gardener.runtime.js";import {installWorkflowDemo} from "./workflow-demo-services.js";const examples=await fetch("./workflow-examples.json").then(r=>r.json());function mount(scope){init(scope);for(const root of scope.querySelectorAll("[data-g-workflow]"))installWorkflowDemo(root,getInstance);}mount(document);for(const section of document.querySelectorAll("[data-example]"))section.querySelector("select").addEventListener("change",e=>{const stage=section.querySelector("[data-stage]");destroy(stage);stage.innerHTML=examples[section.dataset.example][e.target.value].html;mount(stage);});</script></body></html>
