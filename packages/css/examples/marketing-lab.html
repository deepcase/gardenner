<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>营销 组件完整演示</title><link rel="stylesheet" href="../dist/gardener.css"><link rel="stylesheet" href="marketing-demo.css"></head><body><main style="max-width:1100px;margin:auto;padding:24px"><h1>营销 · 10 个组件 / 40 个变体</h1><p>本地模拟服务，不发送邮件、不保存订阅、不创建订单。</p><section data-example="site-header"><h2>site-header</h2><label>变体<select aria-label="site-header 变体"><option>standard</option><option>centered</option><option>compact</option><option>sticky</option></select></label><div data-stage><div class="g-site-header g-site-header-standard" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;site-header&quot;,&quot;mode&quot;:&quot;standard&quot;,&quot;title&quot;:&quot;品牌导航&quot;,&quot;description&quot;:&quot;用清晰的内容与恰当的交互，呈现产品价值。&quot;,&quot;actions&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;label&quot;:&quot;开始体验&quot;,&quot;primary&quot;:true},{&quot;id&quot;:&quot;learn&quot;,&quot;label&quot;:&quot;了解详情&quot;,&quot;href&quot;:&quot;#marketing-details&quot;}],&quot;items&quot;:[{&quot;id&quot;:&quot;product&quot;,&quot;label&quot;:&quot;产品&quot;,&quot;href&quot;:&quot;#product&quot;,&quot;children&quot;:[{&quot;id&quot;:&quot;design&quot;,&quot;label&quot;:&quot;设计工作台&quot;,&quot;href&quot;:&quot;#design&quot;},{&quot;id&quot;:&quot;collaboration&quot;,&quot;label&quot;:&quot;团队协作&quot;,&quot;href&quot;:&quot;#collaboration&quot;}]},{&quot;id&quot;:&quot;pricing&quot;,&quot;label&quot;:&quot;定价&quot;,&quot;href&quot;:&quot;#pricing&quot;},{&quot;id&quot;:&quot;stories&quot;,&quot;label&quot;:&quot;客户故事&quot;,&quot;href&quot;:&quot;#stories&quot;},{&quot;id&quot;:&quot;soon&quot;,&quot;label&quot;:&quot;即将推出&quot;,&quot;disabled&quot;:true}],&quot;columns&quot;:3,&quot;brand&quot;:&quot;GARDEN STUDIO&quot;,&quot;navigationLabel&quot;:&quot;品牌主导航&quot;}"></div></div></section>
<section data-example="hero"><h2>hero</h2><label>变体<select aria-label="hero 变体"><option>split</option><option>centered</option><option>compact</option><option>media</option></select></label><div data-stage><div class="g-hero g-hero-split" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;hero&quot;,&quot;mode&quot;:&quot;split&quot;,&quot;title&quot;:&quot;让想法，成为下一件好作品。&quot;,&quot;description&quot;:&quot;从第一个草图，到每一次团队协作。以清晰的工作方式，专注你真正想创造的内容。&quot;,&quot;actions&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;label&quot;:&quot;开始体验&quot;,&quot;primary&quot;:true},{&quot;id&quot;:&quot;learn&quot;,&quot;label&quot;:&quot;了解详情&quot;,&quot;href&quot;:&quot;#marketing-details&quot;}],&quot;items&quot;:[],&quot;columns&quot;:3,&quot;eyebrow&quot;:&quot;为每一次灵感而设计&quot;,&quot;image&quot;:&quot;marketing-assets/workspace.svg&quot;,&quot;imageAlt&quot;:&quot;演示产品工作台：项目、日程和内容卡片&quot;}"></div></div></section>
<section data-example="pricing"><h2>pricing</h2><label>变体<select aria-label="pricing 变体"><option>cards</option><option>comparison</option><option>compact</option><option>enterprise</option></select></label><div data-stage><div class="g-pricing-grid g-pricing-grid-cards" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;pricing&quot;,&quot;mode&quot;:&quot;cards&quot;,&quot;title&quot;:&quot;从适合你的方案开始&quot;,&quot;description&quot;:&quot;演示价格；年度金额是全年账单，不是每月价格。&quot;,&quot;actions&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;label&quot;:&quot;开始体验&quot;,&quot;primary&quot;:true},{&quot;id&quot;:&quot;learn&quot;,&quot;label&quot;:&quot;了解详情&quot;,&quot;href&quot;:&quot;#marketing-details&quot;}],&quot;items&quot;:[{&quot;id&quot;:&quot;starter&quot;,&quot;title&quot;:&quot;个人&quot;,&quot;monthly&quot;:2900,&quot;yearly&quot;:29000,&quot;features&quot;:{&quot;项目&quot;:&quot;3 个&quot;,&quot;协作席位&quot;:&quot;按需增加&quot;,&quot;版本历史&quot;:false}},{&quot;id&quot;:&quot;team&quot;,&quot;title&quot;:&quot;团队&quot;,&quot;monthly&quot;:6900,&quot;yearly&quot;:69000,&quot;featured&quot;:true,&quot;badge&quot;:&quot;团队推荐&quot;,&quot;features&quot;:{&quot;项目&quot;:&quot;不限&quot;,&quot;协作席位&quot;:&quot;按需增加&quot;,&quot;版本历史&quot;:true}},{&quot;id&quot;:&quot;business&quot;,&quot;title&quot;:&quot;企业&quot;,&quot;monthly&quot;:null,&quot;yearly&quot;:null,&quot;description&quot;:&quot;按组织需求配置部署与支持。&quot;,&quot;features&quot;:{&quot;项目&quot;:&quot;不限&quot;,&quot;协作席位&quot;:&quot;定制&quot;,&quot;版本历史&quot;:true}}],&quot;columns&quot;:3,&quot;defaultValue&quot;:{&quot;cycle&quot;:&quot;monthly&quot;,&quot;quantity&quot;:1},&quot;maxQuantity&quot;:100}"></div></div></section>
<section data-example="feature-grid"><h2>feature-grid</h2><label>变体<select aria-label="feature-grid 变体"><option>cards</option><option>alternating</option><option>compact</option><option>tabs</option></select></label><div data-stage><div class="g-feature-grid g-feature-grid-cards" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;feature-grid&quot;,&quot;mode&quot;:&quot;cards&quot;,&quot;title&quot;:&quot;把工作安排得更清楚&quot;,&quot;description&quot;:&quot;用清晰的内容与恰当的交互，呈现产品价值。&quot;,&quot;actions&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;label&quot;:&quot;开始体验&quot;,&quot;primary&quot;:true},{&quot;id&quot;:&quot;learn&quot;,&quot;label&quot;:&quot;了解详情&quot;,&quot;href&quot;:&quot;#marketing-details&quot;}],&quot;items&quot;:[{&quot;id&quot;:&quot;canvas&quot;,&quot;title&quot;:&quot;灵活画布&quot;,&quot;description&quot;:&quot;集中组织灵感、素材与初稿。&quot;,&quot;category&quot;:&quot;create&quot;,&quot;image&quot;:&quot;marketing-assets/workspace.svg&quot;,&quot;href&quot;:&quot;#canvas&quot;,&quot;label&quot;:&quot;查看画布&quot;},{&quot;id&quot;:&quot;review&quot;,&quot;title&quot;:&quot;一起评审&quot;,&quot;description&quot;:&quot;把讨论留在内容旁，减少反复确认。&quot;,&quot;category&quot;:&quot;team&quot;,&quot;image&quot;:&quot;marketing-assets/workspace.svg&quot;,&quot;href&quot;:&quot;#review&quot;,&quot;label&quot;:&quot;查看评审&quot;},{&quot;id&quot;:&quot;publish&quot;,&quot;title&quot;:&quot;有序发布&quot;,&quot;description&quot;:&quot;统一管理内容状态与发布计划。&quot;,&quot;category&quot;:&quot;create&quot;,&quot;image&quot;:&quot;marketing-assets/workspace.svg&quot;,&quot;href&quot;:&quot;#publish&quot;,&quot;label&quot;:&quot;查看发布&quot;}],&quot;columns&quot;:3,&quot;categories&quot;:[]}"></div></div></section>
<section data-example="logo-cloud"><h2>logo-cloud</h2><label>变体<select aria-label="logo-cloud 变体"><option>grid</option><option>strip</option><option>compact</option><option>monochrome</option></select></label><div data-stage><div class="g-logo-cloud g-logo-cloud-grid" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;logo-cloud&quot;,&quot;mode&quot;:&quot;grid&quot;,&quot;title&quot;:&quot;以开放合作，连接更多可能&quot;,&quot;description&quot;:&quot;以下为虚构品牌标识，用于组件演示。&quot;,&quot;actions&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;label&quot;:&quot;开始体验&quot;,&quot;primary&quot;:true},{&quot;id&quot;:&quot;learn&quot;,&quot;label&quot;:&quot;了解详情&quot;,&quot;href&quot;:&quot;#marketing-details&quot;}],&quot;items&quot;:[{&quot;id&quot;:&quot;brand-0&quot;,&quot;title&quot;:&quot;NORTH&quot;,&quot;image&quot;:&quot;marketing-assets/brand-0.svg&quot;,&quot;alt&quot;:&quot;NORTH&quot;},{&quot;id&quot;:&quot;brand-1&quot;,&quot;title&quot;:&quot;SORA&quot;,&quot;image&quot;:&quot;marketing-assets/brand-1.svg&quot;,&quot;alt&quot;:&quot;SORA&quot;},{&quot;id&quot;:&quot;brand-2&quot;,&quot;title&quot;:&quot;FORMA&quot;,&quot;image&quot;:&quot;marketing-assets/brand-2.svg&quot;,&quot;alt&quot;:&quot;FORMA&quot;},{&quot;id&quot;:&quot;brand-3&quot;,&quot;title&quot;:&quot;MONO&quot;,&quot;image&quot;:&quot;marketing-assets/brand-3.svg&quot;,&quot;alt&quot;:&quot;MONO&quot;},{&quot;id&quot;:&quot;brand-4&quot;,&quot;title&quot;:&quot;FIELD&quot;,&quot;image&quot;:&quot;marketing-assets/brand-4.svg&quot;,&quot;alt&quot;:&quot;FIELD&quot;},{&quot;id&quot;:&quot;brand-5&quot;,&quot;title&quot;:&quot;ATELIER&quot;,&quot;image&quot;:&quot;marketing-assets/brand-5.svg&quot;,&quot;alt&quot;:&quot;ATELIER&quot;}],&quot;columns&quot;:3}"></div></div></section>
<section data-example="testimonial"><h2>testimonial</h2><label>变体<select aria-label="testimonial 变体"><option>cards</option><option>carousel</option><option>compact</option><option>featured</option></select></label><div data-stage><div class="g-testimonial-grid g-testimonial-grid-cards" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;testimonial&quot;,&quot;mode&quot;:&quot;cards&quot;,&quot;title&quot;:&quot;不同团队，共同的清晰体验&quot;,&quot;description&quot;:&quot;以下人物与评价为演示文案。&quot;,&quot;actions&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;label&quot;:&quot;开始体验&quot;,&quot;primary&quot;:true},{&quot;id&quot;:&quot;learn&quot;,&quot;label&quot;:&quot;了解详情&quot;,&quot;href&quot;:&quot;#marketing-details&quot;}],&quot;items&quot;:[{&quot;id&quot;:&quot;one&quot;,&quot;quote&quot;:&quot;我们终于能在同一处讨论内容、跟进修改，让设计工作的每一步都有迹可循。&quot;,&quot;author&quot;:&quot;林青&quot;,&quot;role&quot;:&quot;演示工作室 · 设计负责人&quot;},{&quot;id&quot;:&quot;two&quot;,&quot;quote&quot;:&quot;从项目计划到交付复盘，信息清晰了，团队沟通也更简单。&quot;,&quot;author&quot;:&quot;陈夏&quot;,&quot;role&quot;:&quot;演示团队 · 产品经理&quot;},{&quot;id&quot;:&quot;three&quot;,&quot;quote&quot;:&quot;轻量的结构为创作留出了空间，也让每一份内容更容易被找到。&quot;,&quot;author&quot;:&quot;Alex&quot;,&quot;role&quot;:&quot;演示团队 · 内容策划&quot;}],&quot;columns&quot;:3,&quot;defaultValue&quot;:{&quot;index&quot;:0},&quot;autoplay&quot;:false}"></div></div></section>
<section data-example="cta-section"><h2>cta-section</h2><label>变体<select aria-label="cta-section 变体"><option>inline</option><option>centered</option><option>split</option><option>subtle</option></select></label><div data-stage><div class="g-cta-section g-cta-section-inline" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;cta-section&quot;,&quot;mode&quot;:&quot;inline&quot;,&quot;title&quot;:&quot;为你的团队，留出更多创作空间。&quot;,&quot;description&quot;:&quot;体验一套清晰、灵活、容易协作的工作方式。&quot;,&quot;actions&quot;:[{&quot;id&quot;:&quot;start&quot;,&quot;label&quot;:&quot;开始体验&quot;,&quot;primary&quot;:true},{&quot;id&quot;:&quot;learn&quot;,&quot;label&quot;:&quot;了解详情&quot;,&quot;href&quot;:&quot;#marketing-details&quot;}],&quot;items&quot;:[],&quot;columns&quot;:3,&quot;eyebrow&quot;:&quot;下一步，从这里开始&quot;}"></div></div></section>
<section data-example="newsletter"><h2>newsletter</h2><label>变体<select aria-label="newsletter 变体"><option>inline</option><option>card</option><option>split</option><option>minimal</option></select></label><div data-stage><div class="g-newsletter g-newsletter-inline" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;newsletter&quot;,&quot;mode&quot;:&quot;inline&quot;,&quot;title&quot;:&quot;有价值的更新，送到你的收件箱&quot;,&quot;description&quot;:&quot;产品动态与实践分享。演示不会发送邮件或保存订阅。&quot;,&quot;actions&quot;:[],&quot;items&quot;:[],&quot;columns&quot;:3,&quot;privacyUrl&quot;:&quot;#privacy&quot;,&quot;privacyLabel&quot;:&quot;阅读隐私政策&quot;,&quot;requireConsent&quot;:true}"></div></div></section>
<section data-example="announcement-bar"><h2>announcement-bar</h2><label>变体<select aria-label="announcement-bar 变体"><option>inline</option><option>sticky</option><option>countdown</option><option>subtle</option></select></label><div data-stage><div class="g-announcement-bar g-announcement-bar-inline" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;announcement-bar&quot;,&quot;mode&quot;:&quot;inline&quot;,&quot;title&quot;:&quot;秋日创作计划&quot;,&quot;description&quot;:&quot;查看新功能与活动安排。&quot;,&quot;actions&quot;:[{&quot;id&quot;:&quot;event&quot;,&quot;label&quot;:&quot;了解活动&quot;,&quot;primary&quot;:true}],&quot;items&quot;:[],&quot;columns&quot;:3,&quot;dismissible&quot;:true}"></div></div></section>
<section data-example="site-footer"><h2>site-footer</h2><label>变体<select aria-label="site-footer 变体"><option>columns</option><option>simple</option><option>centered</option><option>compact</option></select></label><div data-stage><div class="g-site-footer g-site-footer-columns" data-demo-component data-g-marketing data-g-marketing-options="{&quot;kind&quot;:&quot;site-footer&quot;,&quot;mode&quot;:&quot;columns&quot;,&quot;title&quot;:&quot;GARDEN STUDIO&quot;,&quot;description&quot;:&quot;让创作自然生长。&quot;,&quot;actions&quot;:[],&quot;items&quot;:[],&quot;columns&quot;:3,&quot;copyright&quot;:&quot;© 2026 Garden Studio · 虚构品牌演示&quot;,&quot;groups&quot;:[{&quot;id&quot;:&quot;product&quot;,&quot;title&quot;:&quot;产品&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;overview&quot;,&quot;title&quot;:&quot;产品概览&quot;,&quot;href&quot;:&quot;#overview&quot;},{&quot;id&quot;:&quot;plans&quot;,&quot;title&quot;:&quot;方案定价&quot;,&quot;href&quot;:&quot;#plans&quot;}]},{&quot;id&quot;:&quot;resources&quot;,&quot;title&quot;:&quot;资源&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;docs&quot;,&quot;title&quot;:&quot;使用文档&quot;,&quot;href&quot;:&quot;#docs&quot;},{&quot;id&quot;:&quot;support&quot;,&quot;title&quot;:&quot;帮助中心&quot;,&quot;href&quot;:&quot;#support&quot;}]},{&quot;id&quot;:&quot;company&quot;,&quot;title&quot;:&quot;关于&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;about&quot;,&quot;title&quot;:&quot;团队介绍&quot;,&quot;href&quot;:&quot;#about&quot;},{&quot;id&quot;:&quot;privacy&quot;,&quot;title&quot;:&quot;隐私政策&quot;,&quot;href&quot;:&quot;#privacy&quot;}]}]}"></div></div></section></main><script type="module">import {init,destroy,getInstance} from "../dist/gardener.runtime.js";import {installMarketingDemo} from "./marketing-demo-services.js";const examples=await fetch("./marketing-examples.json").then(r=>r.json());function mount(scope){init(scope);for(const root of scope.querySelectorAll("[data-g-marketing]"))installMarketingDemo(root,getInstance);}mount(document);for(const section of document.querySelectorAll("[data-example]"))section.querySelector("select").addEventListener("change",e=>{const stage=section.querySelector("[data-stage]");destroy(stage);stage.innerHTML=examples[section.dataset.example][e.target.value].html;mount(stage);});</script></body></html>
