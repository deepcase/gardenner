<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GCollapse</title><link rel="stylesheet" href="../dist/gardener.min.css"><style>body{margin:0;padding:24px;font:14px/22px sans-serif;color:var(--g-color-text);background:var(--g-color-background)}main{max-width:900px;margin:auto}h1{font-size:28px}h2{font-size:20px}section{margin:28px 0}nav,.controls{display:flex;gap:12px;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}select{font:inherit;min-height:28px}output{display:block;margin:12px 0}nav a{display:inline-flex;align-items:center;min-height:24px;padding:2px 4px}</style></head><body><main><h1>GCollapse</h1><nav><a href="#basic">Multiple panels</a><a href="#accordion">Accordion</a><a href="#controlled">Controlled active keys</a><a href="#borderless">Borderless</a><a href="#icons">Custom icons</a><a href="#extra">Extra actions</a><a href="#nested">Nested panels</a><a href="#destroy">Destroy on hide</a></nav><div class="controls"><label>Icon position<select id="position"><option>left</option><option>right</option></select></label><label>Size<select id="size"><option>medium</option><option>small</option><option>large</option></select></label><label><input id="border" type="checkbox" checked>Border</label><label><input id="dark" type="checkbox">Dark</label></div><section id="basic"><h2>Multiple panels</h2><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Multiple panels","items":[{"key":"a","header":"Project overview","content":"Keep project context, resources and milestones together."},{"key":2,"header":"Advanced settings","content":"Configure notifications and access policies."},{"key":"locked","header":"Organization policy","disabled":true,"content":"Managed by your administrator."}]}'></div></section><section id="accordion"><h2>Accordion</h2><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Accordion","items":[{"key":"a","header":"Project overview","content":"Keep project context, resources and milestones together."},{"key":2,"header":"Advanced settings","content":"Configure notifications and access policies."},{"key":"locked","header":"Organization policy","disabled":true,"content":"Managed by your administrator."}],"accordion":true,"collapsible":false}'></div></section><section id="controlled"><h2>Controlled active keys</h2><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Controlled active keys","items":[{"key":"a","header":"Project overview","content":"Keep project context, resources and milestones together."},{"key":2,"header":"Advanced settings","content":"Configure notifications and access policies."},{"key":"locked","header":"Organization policy","disabled":true,"content":"Managed by your administrator."}],"activeKey":["a"]}'></div></section><section id="borderless"><h2>Borderless</h2><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Borderless","items":[{"key":"a","header":"Project overview","content":"Keep project context, resources and milestones together."},{"key":2,"header":"Advanced settings","content":"Configure notifications and access policies."},{"key":"locked","header":"Organization policy","disabled":true,"content":"Managed by your administrator."}],"bordered":false,"defaultActiveKey":["a"]}'></div></section><section id="icons"><h2>Custom icons</h2><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Custom icons","items":[{"key":"a","header":"Project overview","content":"Keep project context, resources and milestones together."},{"key":2,"header":"Advanced settings","content":"Configure notifications and access policies."},{"key":"locked","header":"Organization policy","disabled":true,"content":"Managed by your administrator."}],"expandIconPosition":"right","expandIcon":{"collapsed":"+","expanded":"−"}}'></div></section><section id="extra"><h2>Extra actions</h2><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Extra actions","items":[{"key":"a","header":"Project overview","content":"Keep project context, resources and milestones together.","extra":{"label":"Edit","action":"edit"}}]}'></div></section><section id="nested"><h2>Nested panels</h2><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Nested panels","items":[{"key":"parent","header":"Notification settings","contentTemplate":"nested-template"}],"defaultActiveKey":["parent"]}'></div></section><section id="destroy"><h2>Destroy on hide</h2><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Destroy on hide","items":[{"key":"form","header":"Project form","contentTemplate":"form-template"}],"defaultActiveKey":["form"],"destroyOnHide":true}'></div></section><output id="state" aria-live="polite">Expand a panel or choose an extra action.</output></main><template id="form-template"><label style="color:var(--g-color-text)">Project name<input class="g-input" style="background:var(--g-color-surface);color:var(--g-color-text)" aria-label="Project name" value="Garden studio"></label><p style="color:var(--g-color-text)">Edit, close and reopen to test reset.</p></template><template id="nested-template"><div class="g-collapse-panel" data-g-accordion data-g-disclosure-options='{"label":"Nested","items":[{"key":"child","header":"Notification rules","content":"Independent nested state."}]}'></div></template><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';init(document);const root=document.querySelector('#basic [data-g-accordion]');window.collapse=getInstance(root,'accordion');window.setCollapseOptions=patch=>{root.dataset.gDisclosureOptions=JSON.stringify({...JSON.parse(root.dataset.gDisclosureOptions),...patch});window.collapse.refresh();};for(const [id,key]of [['position','expandIconPosition'],['size','size']])document.getElementById(id).onchange=e=>window.setCollapseOptions({[key]:e.target.value});document.getElementById('border').onchange=e=>window.setCollapseOptions({bordered:e.target.checked});document.getElementById('dark').onchange=e=>document.documentElement.setAttribute('data-g-mode',e.target.checked?'dark':'light');document.addEventListener('gardener:change',e=>{document.getElementById('state').textContent=JSON.stringify(e.detail.activeKey);if(e.target.closest('#controlled')){e.target.dataset.gDisclosureOptions=JSON.stringify({...JSON.parse(e.target.dataset.gDisclosureOptions),activeKey:e.detail.activeKey});getInstance(e.target,'accordion').refresh();}});document.addEventListener('gardener:action',e=>document.getElementById('state').textContent=e.detail.action);</script></body></html>
