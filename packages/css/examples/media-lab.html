<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>媒体组件完整演示</title><link rel="stylesheet" href="../dist/gardener.min.css"><link rel="stylesheet" href="media-demo.css"></head><body><main style="max-width:1100px;margin:auto;padding:24px"><h1>媒体组件 · 8 个组件 / 34 个变体</h1><p>图片与音视频资源均在本地；裁剪可导出真实图片。</p><section data-example="image"><h2>image</h2><label>变体<select aria-label="image 变体"><option>default</option><option>square</option><option>circle</option><option>cover</option><option>contain</option></select></label><div data-stage><div class="media-demo-host"><div class="g-image" data-demo-component data-g-media data-g-media-options="{&quot;kind&quot;:&quot;image&quot;,&quot;mode&quot;:&quot;default&quot;,&quot;title&quot;:&quot;图片与交互预览&quot;,&quot;description&quot;:&quot;通过参数切换内容、尺寸和状态；图片、视频、音频均为本地演示资源。&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;mountain&quot;,&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;alt&quot;:&quot;绿色山谷与日出&quot;,&quot;title&quot;:&quot;山谷日出&quot;},{&quot;id&quot;:&quot;sea&quot;,&quot;src&quot;:&quot;media-assets/sea.svg&quot;,&quot;alt&quot;:&quot;蓝色海岸与日出&quot;,&quot;title&quot;:&quot;清晨海岸&quot;},{&quot;id&quot;:&quot;sunset&quot;,&quot;src&quot;:&quot;media-assets/sunset.svg&quot;,&quot;alt&quot;:&quot;暖色山峦与夕阳&quot;,&quot;title&quot;:&quot;日落时分&quot;}],&quot;size&quot;:&quot;medium&quot;,&quot;bordered&quot;:true,&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;width&quot;:240,&quot;height&quot;:135,&quot;showLoader&quot;:true,&quot;hideFooter&quot;:&quot;never&quot;,&quot;footerPosition&quot;:&quot;outer&quot;}"></div><output class="media-demo-result"></output></div></div></section>
<section data-example="carousel"><h2>carousel</h2><label>变体<select aria-label="carousel 变体"><option>default</option><option>fade</option><option>thumbnails</option><option>vertical</option><option>compact</option></select></label><div data-stage><div class="media-demo-host"><div class="g-carousel" data-demo-component data-g-media data-g-media-options="{&quot;kind&quot;:&quot;carousel&quot;,&quot;mode&quot;:&quot;default&quot;,&quot;title&quot;:&quot;图片轮播&quot;,&quot;description&quot;:&quot;通过参数切换内容、尺寸和状态；图片、视频、音频均为本地演示资源。&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;mountain&quot;,&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;alt&quot;:&quot;绿色山谷与日出&quot;,&quot;title&quot;:&quot;山谷日出&quot;},{&quot;id&quot;:&quot;sea&quot;,&quot;src&quot;:&quot;media-assets/sea.svg&quot;,&quot;alt&quot;:&quot;蓝色海岸与日出&quot;,&quot;title&quot;:&quot;清晨海岸&quot;},{&quot;id&quot;:&quot;sunset&quot;,&quot;src&quot;:&quot;media-assets/sunset.svg&quot;,&quot;alt&quot;:&quot;暖色山峦与夕阳&quot;,&quot;title&quot;:&quot;日落时分&quot;}],&quot;size&quot;:&quot;medium&quot;,&quot;bordered&quot;:true,&quot;thumbnails&quot;:false,&quot;loop&quot;:true,&quot;interval&quot;:3000}"></div><output class="media-demo-result"></output></div></div></section>
<section data-example="gallery-lightbox"><h2>gallery-lightbox</h2><label>变体<select aria-label="gallery-lightbox 变体"><option>grid</option><option>compact</option><option>masonry</option><option>strip</option></select></label><div data-stage><div class="media-demo-host"><div class="g-gallery" data-demo-component data-g-media data-g-media-options="{&quot;kind&quot;:&quot;gallery-lightbox&quot;,&quot;mode&quot;:&quot;grid&quot;,&quot;title&quot;:&quot;图片画廊与灯箱&quot;,&quot;description&quot;:&quot;通过参数切换内容、尺寸和状态；图片、视频、音频均为本地演示资源。&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;mountain&quot;,&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;alt&quot;:&quot;绿色山谷与日出&quot;,&quot;title&quot;:&quot;山谷日出&quot;},{&quot;id&quot;:&quot;sea&quot;,&quot;src&quot;:&quot;media-assets/sea.svg&quot;,&quot;alt&quot;:&quot;蓝色海岸与日出&quot;,&quot;title&quot;:&quot;清晨海岸&quot;},{&quot;id&quot;:&quot;sunset&quot;,&quot;src&quot;:&quot;media-assets/sunset.svg&quot;,&quot;alt&quot;:&quot;暖色山峦与夕阳&quot;,&quot;title&quot;:&quot;日落时分&quot;}],&quot;size&quot;:&quot;medium&quot;,&quot;bordered&quot;:true,&quot;columns&quot;:3}"></div><output class="media-demo-result"></output></div></div></section>
<section data-example="media-player"><h2>media-player</h2><label>变体<select aria-label="media-player 变体"><option>video</option><option>audio</option><option>playlist</option><option>compact</option></select></label><div data-stage><div class="media-demo-host"><div class="g-media-player" data-demo-component data-g-media data-g-media-options="{&quot;kind&quot;:&quot;media-player&quot;,&quot;mode&quot;:&quot;video&quot;,&quot;title&quot;:&quot;音视频播放器&quot;,&quot;description&quot;:&quot;通过参数切换内容、尺寸和状态；图片、视频、音频均为本地演示资源。&quot;,&quot;items&quot;:[],&quot;size&quot;:&quot;medium&quot;,&quot;bordered&quot;:true,&quot;loop&quot;:false,&quot;sources&quot;:[{&quot;src&quot;:&quot;content-assets/sample.webm&quot;,&quot;type&quot;:&quot;video/webm&quot;},{&quot;src&quot;:&quot;content-assets/sample.mp4&quot;,&quot;type&quot;:&quot;video/mp4&quot;}],&quot;poster&quot;:&quot;media-assets/mountain.svg&quot;,&quot;tracks&quot;:[{&quot;src&quot;:&quot;media-assets/captions.vtt&quot;,&quot;srclang&quot;:&quot;zh&quot;,&quot;label&quot;:&quot;中文字幕&quot;,&quot;default&quot;:true}]}"></div><output class="media-demo-result"></output></div></div></section>
<section data-example="document-viewer"><h2>document-viewer</h2><label>变体<select aria-label="document-viewer 变体"><option>default</option><option>thumbnails</option><option>continuous</option><option>compact</option></select></label><div data-stage><div class="media-demo-host"><div class="g-document-viewer" data-demo-component data-g-media data-g-media-options="{&quot;kind&quot;:&quot;document-viewer&quot;,&quot;mode&quot;:&quot;default&quot;,&quot;title&quot;:&quot;文档预览&quot;,&quot;description&quot;:&quot;通过参数切换内容、尺寸和状态；图片、视频、音频均为本地演示资源。&quot;,&quot;items&quot;:[],&quot;size&quot;:&quot;medium&quot;,&quot;bordered&quot;:true,&quot;pages&quot;:[&quot;# 组件使用指南\n\n欢迎使用 Gardenerim。\n\n- 统一尺寸与间距\n- 支持键盘操作\n- 五端保持一致&quot;,&quot;## 参数配置\n\n通过 **mediaOptions** 提供内容、布局和行为。\n\n```js\n{ kind: \&quot;carousel\&quot;, loop: false }\n```&quot;,&quot;## 发布检查\n\n验证加载、错误、禁用和窄屏表现。&quot;],&quot;type&quot;:&quot;pages&quot;,&quot;src&quot;:&quot;content-assets/sample.pdf&quot;,&quot;pageCount&quot;:3}"></div><output class="media-demo-result"></output></div></div></section>
<section data-example="image-crop-shell"><h2>image-crop-shell</h2><label>变体<select aria-label="image-crop-shell 变体"><option>default</option><option>square</option><option>wide</option><option>compact</option></select></label><div data-stage><div class="media-demo-host"><div class="g-image-crop" data-demo-component data-g-media data-g-media-options="{&quot;kind&quot;:&quot;image-crop-shell&quot;,&quot;mode&quot;:&quot;default&quot;,&quot;title&quot;:&quot;图片裁剪&quot;,&quot;description&quot;:&quot;通过参数切换内容、尺寸和状态；图片、视频、音频均为本地演示资源。&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;mountain&quot;,&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;alt&quot;:&quot;绿色山谷与日出&quot;,&quot;title&quot;:&quot;山谷日出&quot;}],&quot;size&quot;:&quot;medium&quot;,&quot;bordered&quot;:true,&quot;outputType&quot;:&quot;image/png&quot;}"></div><output class="media-demo-result"></output></div></div></section>
<section data-example="responsive-image"><h2>responsive-image</h2><label>变体<select aria-label="responsive-image 变体"><option>default</option><option>square</option><option>circle</option><option>cover</option><option>contain</option></select></label><div data-stage><div class="media-demo-host"><div class="g-responsive-image" data-demo-component data-g-media data-g-media-options="{&quot;kind&quot;:&quot;responsive-image&quot;,&quot;mode&quot;:&quot;default&quot;,&quot;title&quot;:&quot;响应式图片&quot;,&quot;description&quot;:&quot;通过参数切换内容、尺寸和状态；图片、视频、音频均为本地演示资源。&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;mountain&quot;,&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;alt&quot;:&quot;绿色山谷与日出&quot;,&quot;title&quot;:&quot;山谷日出&quot;}],&quot;size&quot;:&quot;medium&quot;,&quot;bordered&quot;:true,&quot;srcset&quot;:[{&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;descriptor&quot;:&quot;640w&quot;},{&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;descriptor&quot;:&quot;1280w&quot;}],&quot;sizes&quot;:&quot;(max-width: 600px) 100vw, 900px&quot;,&quot;caption&quot;:&quot;自适应资源与容器；也可单独配置 contain / cover。&quot;}"></div><output class="media-demo-result"></output></div></div></section>
<section data-example="image-comparison"><h2>image-comparison</h2><label>变体<select aria-label="image-comparison 变体"><option>horizontal</option><option>vertical</option><option>compact</option></select></label><div data-stage><div class="media-demo-host"><div class="g-image-comparison" data-demo-component data-g-media data-g-media-options="{&quot;kind&quot;:&quot;image-comparison&quot;,&quot;mode&quot;:&quot;horizontal&quot;,&quot;title&quot;:&quot;图片对比&quot;,&quot;description&quot;:&quot;通过参数切换内容、尺寸和状态；图片、视频、音频均为本地演示资源。&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;mountain&quot;,&quot;src&quot;:&quot;media-assets/mountain.svg&quot;,&quot;alt&quot;:&quot;绿色山谷与日出&quot;,&quot;title&quot;:&quot;山谷日出&quot;},{&quot;id&quot;:&quot;sunset&quot;,&quot;src&quot;:&quot;media-assets/sunset.svg&quot;,&quot;alt&quot;:&quot;暖色山峦与夕阳&quot;,&quot;title&quot;:&quot;日落时分&quot;}],&quot;size&quot;:&quot;medium&quot;,&quot;bordered&quot;:true}"></div><output class="media-demo-result"></output></div></div></section></main><script type="module">import {init,destroy} from "../dist/gardener.runtime.js";import {installMediaDemo} from "./media-demo-services.js";const examples=await fetch("./media-examples.json").then(r=>r.json());function mount(scope){init(scope);for(const root of scope.querySelectorAll("[data-g-media]"))installMediaDemo(root);}mount(document);for(const section of document.querySelectorAll("[data-example]"))section.querySelector("select").addEventListener("change",e=>{const stage=section.querySelector("[data-stage]");destroy(stage);stage.innerHTML=examples[section.dataset.example][e.target.value].html;mount(stage);});</script></body></html>
