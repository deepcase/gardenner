<!doctype html>
<html lang="zh-CN" data-g-theme="blue" data-g-neutral="cool" data-g-shape="small">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gardenerim 登录配方</title><link rel="stylesheet" href="../dist/gardener.css"></head>
<body>
  <main class="g-auth-shell g-auth-shell--split">
    <section class="g-auth-visual"><div class="g-max-w-reading"><span class="g-badge">Gardenerim CMS</span><h1 class="g-mt-4">一个工作区，管理所有内容与品牌。</h1><p>适合企业 SSO、租户选择、密码、通行密钥和多因素验证。</p></div></section>
    <section class="g-auth-main">
      <form class="g-auth-card">
        <header class="g-auth-heading"><h2>欢迎回来</h2><p class="g-text-muted">登录企业工作区</p></header>
        <div class="g-auth-sso"><button class="g-btn g-btn-outline" type="button">使用企业 SSO</button><button class="g-btn g-btn-outline" type="button">使用通行密钥</button></div>
        <div class="g-auth-divider">或使用邮箱</div>
        <label class="g-field"><span class="g-label">邮箱</span><input class="g-input" type="email" autocomplete="username" required></label>
        <label class="g-field"><span class="g-label">密码</span><input class="g-input" type="password" autocomplete="current-password" required></label>
        <div class="g-flex g-items-center g-justify-between"><label class="g-check"><input type="checkbox"><span>保持登录</span></label><a href="#">忘记密码？</a></div>
        <button class="g-btn g-btn-primary g-btn-block" type="submit">登录</button>
      </form>
    </section>
  </main>
</body></html>
