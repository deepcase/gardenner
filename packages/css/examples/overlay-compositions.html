<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六项浮层 · CSS</title><link rel="stylesheet" href="../dist/gardener.css"><style>body{padding:24px;box-sizing:border-box}#overlay-settings{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}#overlay-settings label{font-size:13px}select{max-width:160px}article>label{display:block;margin-bottom:12px}main{display:flex;flex-wrap:wrap;gap:24px}article{padding:24px;border:1px solid var(--g-color-border);min-width:0;max-width:100%;box-sizing:border-box}</style></head><body><h1>浮层 · CSS 与共享运行时</h1><main>
<article><h2>Dialog</h2><button type="button" class="g-btn" data-g-dialog-open="overlay-css-dialog">编辑项目</button><div id="overlay-css-dialog" class="g-dialog-backdrop" data-g-dialog hidden data-g-overlay-width="520"><section class="g-dialog" role="dialog" aria-modal="true"><header class="g-dialog-header"><h3 class="g-dialog-title">编辑项目</h3><button type="button" class="g-dialog-close" data-g-close aria-label="关闭">×</button></header><div class="g-dialog-body"><label>名称<input class="g-input" value="项目草稿"></label></div><footer class="g-dialog-footer"><button type="button" class="g-btn" data-g-overlay-cancel>取消</button><button type="button" class="g-btn g-btn-primary" data-g-overlay-confirm>保存</button></footer></section></div></article>
<article><h2>Drawer</h2><button type="button" class="g-btn" data-g-drawer-open="overlay-css-drawer">打开抽屉</button><div id="overlay-css-drawer" class="g-drawer-backdrop" data-g-drawer data-g-side="end" hidden><section class="g-drawer" role="dialog" aria-modal="true"><header class="g-drawer-header"><h3 class="g-drawer-title">筛选条件</h3><button type="button" class="g-dialog-close" data-g-close aria-label="关闭">×</button></header><div class="g-drawer-body"><label>关键词<input class="g-input"></label></div><footer class="g-drawer-footer"><button type="button" class="g-btn" data-g-close>完成</button></footer></section></div></article>
<article><h2>Popover</h2><div data-g-popover data-g-overlay-placement="bottom-start"><button type="button" class="g-btn" data-g-popover-trigger>快捷编辑</button><div class="g-popover" data-g-popover-content hidden><h3 class="g-popover-title">草稿信息</h3><div class="g-popover-content"><input class="g-input" value="项目名称" aria-label="项目名称"></div><footer class="g-popover-footer"><button type="button" class="g-btn" data-g-close>关闭</button></footer></div></div></article>
<article><h2>Tooltip</h2><div data-g-tooltip data-g-overlay-placement="top"><button type="button" class="g-btn" data-g-tooltip-trigger>悬停或聚焦</button><div class="g-tooltip" data-g-tooltip-content hidden>草稿会保留在当前页面。</div></div></article>
<article><h2>Popconfirm</h2><div class="g-popconfirm" data-g-popover data-g-overlay-async><button type="button" class="g-btn" data-g-popover-trigger>移除项目</button><div class="g-popconfirm" data-g-popover-content hidden><div class="g-popconfirm-icon" aria-hidden="true">!</div><h3 class="g-popconfirm-title">确认移除？</h3><div class="g-popconfirm-description">异步演示只修改本地状态。</div><p data-g-overlay-error role="status"></p><div class="g-popconfirm-actions"><button type="button" class="g-btn" data-g-overlay-cancel>取消</button><button type="button" class="g-btn g-btn-primary" data-g-overlay-confirm>确认</button></div></div></div></article>
<article><h2>ConfirmDialog</h2><button type="button" class="g-btn" data-g-dialog-open="overlay-css-confirm">发布项目</button><div id="overlay-css-confirm" class="g-confirm-dialog-backdrop" data-g-dialog data-g-overlay-async hidden><section class="g-dialog" role="dialog" aria-modal="true"><header class="g-dialog-header"><h3 class="g-dialog-title">确认发布？</h3></header><div class="g-dialog-body"><div class="g-confirm-dialog-icon" aria-hidden="true">!</div>请先核对项目内容。<p data-g-overlay-error role="status"></p></div><footer class="g-dialog-footer"><button type="button" class="g-btn" data-g-overlay-cancel>取消</button><button type="button" class="g-btn g-btn-primary" data-g-overlay-confirm>确认发布</button></footer></section></div></article>
</main><script type="module" src="overlay-demo.js"></script></body></html>
