neering","amount":3192},{"key":18,"name":"Member 18","team":"Design","amount":3329},{"key":19,"name":"Member 19","team":"Engineering","amount":3466},{"key":20,"name":"Member 20","team":"Design","amount":3603},{"key":21,"name":"Member 21","team":"Engineering","amount":3740},{"key":22,"name":"Member 22","team":"Design","amount":3877},{"key":23,"name":"Member 23","team":"Engineering","amount":4014},{"key":24,"name":"Member 24","team":"Design","amount":4151}],"rowSelection":true,"pagination":{"defaultPageSize":5,"pageSizeOptions":[5,10,20]},"scroll":{"x":700,"y":280},"columnResizable":true}'></div><output id="state"></output></main><script type="module">import {init,getInstance} from '../dist/gardener.runtime.js';init(document);const host=document.querySelector('#table');window.table=getInstance(host,'table');document.querySelector('#size').onchange=e=>window.table.update({size:e.target.value});host.addEventListener('gardener:change',e=>document.querySelector('#state').textContent=JSON.stringify(e.detail));</script></body></html>
