<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTabs</title><link rel="stylesheet" href="../dist/gardener.css"><style>main{max-width:800px;margin:auto;padding:24px}.stage{padding:20px;border:1px solid var(--g-color-border);margin:20px 0}label{margin-right:16px}select{font:inherit}output{color:var(--g-color-text)}</style></head><body><main><h1>GTabs</h1><label>类型 <select id="type"><option>line</option><option>card</option><option>card-gutter</option><option>text</option><option>rounded</option><option>capsule</option></select></label><label>尺寸 <select id="size"><option>mini</option><option>small</option><option selected>medium</option><option>large</option></select></label><div class="stage"><div id="tabs" class="g-tabs" data-g-tabs></div></div><output id="result" aria-live="polite">尚未切换</output></main><script type="module">import{init,getInstance}from'../dist/gardener.runtime.js';const root=document.getElementById('tabs');let items=[{key:'one',title:'项目一',content:'项目一的内容',closable:false},{key:'two',title:'项目二',content:'项目二的内容'}],counter=3;root.dataset.gTabsOptions=JSON.stringify({items,editable:true,showAddButton:true,autoSwitch:true,addLabel:'新增项目',closeLabel:'关闭'});init(root);const api=getInstance(root,'tabs');document.getElementById('type').onchange=e=>api.setOptions({type:e.target.value});document.getElementById('size').onchange=e=>api.setOptions({size:e.target.value});root.addEventListener('gardener:change',e=>{if(e.target===root)document.getElementById('result').textContent='当前标签 '+e.detail.key;});root.addEventListener('gardener:add',()=>{const key=String(counter++);items=[...items,{key,title:'项目 '+key,content:'项目 '+key+' 的内容'}];api.setOptions({items});});root.addEventListener('gardener:remove',e=>{if(e.target===root){items=items.filter(x=>x.key!==e.detail.key);api.setOptions({items});}});</script></body></html>
